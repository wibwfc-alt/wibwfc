<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐺 黑狼出席管理</title>
<meta property="og:title" content="🐺 黑狼出席管理">
<meta property="og:description" content="灣島黑狼 FC 出席與堂費管理系統">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wibwfc-alt.github.io/wibwfc/">
<meta name="description" content="灣島黑狼 FC 出席與堂費管理系統">


<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --black: #010101; --card: #0d0d0d; --dark: #111;
  --yellow: #fcc929; --green: #246e58; --red: #e05c2a;
  --white: #f5f5f0; --gray: #666; --border: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--black); color: var(--white); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }

/* TOP BAR */
.topbar {
  background: #0a0a0a; border-bottom: 1px solid rgba(252,201,41,0.15);
  padding: 0 16px; min-height: 56px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.topbar-month { display: flex; align-items: center; gap: 8px; }
@media(max-width:600px) {
  .topbar { padding: 8px 12px; gap: 6px; }
  .topbar .btn, .topbar .btn-outline { font-size:0.72rem; padding:5px 10px; }
  .topbar-logo { font-size:0.82rem; }
}
.topbar-logo { font-size: 0.95rem; font-weight: 900; color: var(--yellow); letter-spacing: 2px; }
.topbar-month { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.topbar-month select, .topbar-month input[type=month] {
  background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 6px 10px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.8rem; cursor: pointer;
}
.btn {
  background: var(--yellow); color: var(--black);
  border: none; padding: 7px 16px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-weight: 700;
  font-size: 0.8rem; cursor: pointer; white-space: nowrap;
  transition: background 0.2s;
}
.btn:hover { background: #e6b520; }
.btn-outline {
  background: none; border: 1px solid rgba(252,201,41,0.35);
  color: var(--yellow);
}
.btn-outline:hover { background: rgba(252,201,41,0.1); }
.btn-red { background: rgba(224,92,42,0.15); color: var(--red); border: 1px solid rgba(224,92,42,0.3); }
.btn-red:hover { background: rgba(224,92,42,0.25); }
.btn-green { background: var(--green); color: white; }
.btn-green:hover { background: #1d5c49; }

/* LAYOUT */
.main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }
@media(max-width:768px){ .main { grid-template-columns: 1fr; } }
@media(max-width:600px){
  .sidebar { padding: 10px; }
    .balance-row { grid-template-columns: repeat(2, 1fr) !important; }
  .dates-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

/* SIDEBAR */
.sidebar {
  background: var(--dark); border-right: 1px solid var(--border);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  height: calc(100vh - 56px); overflow-y: auto; scrollbar-width: none;
}
.sidebar::-webkit-scrollbar { display: none; }
.sidebar-search input {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 8px 12px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem;
}
.sidebar-search input:focus { outline: none; border-color: rgba(252,201,41,0.4); }
.student-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.student-item {
  padding: 10px 12px; border-radius: 4px; cursor: pointer;
  border: 1px solid transparent; transition: all 0.15s;
  display: flex; align-items: center; justify-content: space-between;
}
.student-item:hover { background: rgba(255,255,255,0.04); }
.student-item.active { background: rgba(252,201,41,0.1); border-color: rgba(252,201,41,0.3); }
.student-name { font-size: 0.88rem; font-weight: 700; }
.student-meta { font-size: 0.72rem; color: var(--gray); margin-top: 2px; }
.balance-badge {
  font-size: 0.72rem; font-weight: 700; padding: 2px 8px;
  border-radius: 10px; flex-shrink: 0;
}
.balance-pos { background: rgba(36,110,88,0.2); color: #3aab6e; }
.balance-neg { background: rgba(224,92,42,0.2); color: var(--red); }
.balance-zero { background: rgba(255,255,255,0.05); color: var(--gray); }
.group-header {
  font-size: 0.72rem; font-weight: 900; color: #010101;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 6px 12px; margin-top: 8px;
  background: var(--yellow);
  border-radius: 4px;
}

/* MAIN PANEL */
.panel { padding: 24px; overflow-y: auto; height: calc(100vh - 56px); scrollbar-width: none; }
.panel::-webkit-scrollbar { display: none; }
.panel-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; flex-direction: column; gap: 12px;
  color: var(--gray); font-size: 0.9rem;
}
.panel-empty .icon { font-size: 3rem; opacity: 0.3; }

/* STUDENT CARD */
.student-card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
}
.student-card-info h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 4px; }
.student-card-info .meta { font-size: 0.8rem; color: var(--gray); }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* BALANCE ROW */
.balance-row {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 12px; margin-bottom: 24px;
}
@media(max-width:600px){ .balance-row { grid-template-columns: repeat(2, 1fr); } }
.balance-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 14px 16px;
}
.balance-box-label { font-size: 0.68rem; color: var(--gray); letter-spacing: 1px; margin-bottom: 6px; }
.balance-box-val { font-size: 1.6rem; font-weight: 900; }
.val-yellow { color: var(--yellow); }
.val-green  { color: #3aab6e; }
.val-red    { color: var(--red); }
.val-white  { color: var(--white); }
.balance-box-input {
  display: flex; gap: 6px; margin-top: 8px; align-items: center;
}
.balance-box-input input {
  width: 70px; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); color: var(--white);
  padding: 4px 8px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem;
  text-align: center;
}
.balance-box-input input:focus { outline: none; border-color: rgba(252,201,41,0.4); }

/* ATTENDANCE */
.section-title {
  font-size: 0.72rem; font-weight: 700; color: var(--yellow);
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;
}
.dates-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.date-btn {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 8px; cursor: pointer;
  text-align: center; transition: all 0.15s; user-select: none;
}
.date-btn:hover { border-color: rgba(252,201,41,0.3); }
.date-btn.attended {
  background: rgba(36,110,88,0.2);
  border-color: rgba(36,110,88,0.5);
}
.date-btn .date-day { font-size: 0.7rem; color: var(--gray); }
.date-btn .date-num { font-size: 1rem; font-weight: 700; margin: 2px 0; }
.date-btn .date-venue { font-size: 0.65rem; color: var(--gray); }
.date-btn.attended .date-num { color: #3aab6e; }
.date-btn.attended .date-venue { color: rgba(58,171,110,0.7); }
.check-mark { font-size: 0.7rem; color: #3aab6e; font-weight: 700; }

/* ADD DATE */
.add-date-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 16px; margin-bottom: 24px;
}
.add-date-row input[type=date], .add-date-row input[type=text] {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--white); padding: 6px 10px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.82rem;
}
.add-date-row input:focus { outline: none; border-color: rgba(252,201,41,0.4); }

/* SCREENSHOT PREVIEW */
.preview-card {
  background: #0d0d0d; border: 1px solid rgba(252,201,41,0.2);
  border-radius: 8px; padding: 24px; max-width: 480px;
}
.preview-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.preview-logo { font-size: 1.4rem; }
.preview-title { font-size: 0.7rem; color: var(--yellow); letter-spacing: 2px; }
.preview-name { font-size: 1.2rem; font-weight: 900; }
.preview-divider { height: 1px; background: var(--border); margin: 16px 0; }
.preview-month-title { font-size: 0.72rem; color: var(--yellow); letter-spacing: 2px; margin-bottom: 10px; }
.preview-date-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.85rem;
}
.preview-date-item:last-child { border-bottom: none; }
.preview-check { color: #3aab6e; font-weight: 700; flex-shrink: 0; }
.preview-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 10px; margin-top: 16px;
}
.preview-stat { text-align: center; }
.preview-stat-val { font-size: 1.4rem; font-weight: 900; }
.preview-stat-label { font-size: 0.68rem; color: var(--gray); margin-top: 2px; }
.preview-footer { margin-top: 16px; font-size: 0.72rem; color: var(--gray); text-align: center; }

/* ADD STUDENT MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 100;
  align-items: flex-start; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
}
.modal-overlay.show { display: flex; }
#batchModal { justify-content: flex-start !important; padding: 0 !important; overflow: auto !important; }
.modal {
  background: #111; border: 1px solid var(--border);
  border-radius: 8px; padding: 24px; width: 360px; max-width: 90vw;
}
.modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 0.72rem; color: var(--gray); margin-bottom: 5px; letter-spacing: 1px; }
.form-group input, .form-group select {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 8px 12px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: rgba(252,201,41,0.4); }
.form-group select option { background: #111; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab-btn {
  background: none; border: none; color: var(--gray);
  padding: 8px 16px; cursor: pointer; font-size: 0.82rem;
  font-family: 'Noto Sans TC', sans-serif; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all 0.2s;
}
.tab-btn.active { color: var(--yellow); border-bottom-color: var(--yellow); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.date-card-wrap { position: relative; }
.date-del-btn {
  position: absolute; top: 4px; right: 4px;
  background: rgba(224,92,42,0.15); border: none;
  color: var(--red); width: 20px; height: 20px;
  border-radius: 50%; font-size: 0.6rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
.date-card-wrap:hover .date-del-btn { opacity: 1; }

.overview-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
.overview-table th {
  background:#0a0a0a; padding:8px 12px; text-align:left;
  font-size:0.68rem; color:var(--yellow); letter-spacing:1px;
  border-bottom:1px solid var(--border);
}
.overview-table td { padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.04); }
.overview-table tr:hover td { background:rgba(255,255,255,0.02); cursor:pointer; }
.overview-group-row td { background:rgba(252,201,41,0.05); color:var(--yellow); font-size:0.68rem; font-weight:700; letter-spacing:2px; padding:6px 12px; }

.batch-th {
  background:#0a0a0a; padding:8px 10px;
  color:var(--gray); font-size:0.65rem; letter-spacing:1px;
  border:1px solid #1a1a1a; text-align:center;
  position:sticky; top:0; z-index:2;
}
.batch-th.date-col { min-width:60px; }
.batch-name-th {
  background:#0a0a0a; padding:8px 12px;
  color:var(--white); font-size:0.78rem; font-weight:700;
  border:1px solid #1a1a1a;
  position:sticky; left:0; z-index:3; white-space:nowrap;
}
.batch-td {
  padding:4px; border:1px solid #1a1a1a;
  text-align:center; vertical-align:middle;
  background:#0d0d0d;
}
.batch-name-td {
  padding:6px 12px; border:1px solid rgba(255,255,255,0.05);
  white-space:nowrap; position:sticky; left:0; z-index:1;
  background:#0d0d0d; font-size:0.78rem;
}
.batch-name-td .bn { font-weight:700; color:var(--white); }
.batch-name-td .bm { font-size:0.65rem; color:var(--gray); }
.batch-check {
  width:28px; height:28px; border-radius:4px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; font-weight:900; transition:all 0.1s; margin:auto;
  background:rgba(36,110,88,0.12); border:1px solid rgba(36,110,88,0.3);
  color:transparent;
}
.batch-check:hover { background:rgba(36,110,88,0.2); }
.batch-check.checked { background:rgba(36,110,88,0.35); border-color:rgba(36,110,88,0.7); color:#3aab6e; }
.batch-check.batch-small-empty {
  background:rgba(252,201,41,0.1); border:1px solid rgba(252,201,41,0.25); color:transparent;
}
.batch-check.batch-small-empty:hover { background:rgba(252,201,41,0.2); }
.batch-check.batch-small.checked { background:rgba(252,201,41,0.25); border-color:rgba(252,201,41,0.6); color:#fcc929; }
.batch-check.batch-small.checked { background:rgba(252,201,41,0.2); border-color:rgba(252,201,41,0.5); color:#fcc929; }
.batch-check:hover { border-color:rgba(252,201,41,0.4); }
.batch-group-row { background:rgba(252,201,41,0.15); }
.batch-group-row td { padding:7px 14px; color:#010101; background:var(--yellow); font-size:0.75rem; font-weight:900; letter-spacing:3px; border:1px solid rgba(252,201,41,0.3); }
.batch-total-row td { background:#0a0a0a; color:var(--yellow); font-size:0.7rem; font-weight:700; text-align:center; border:1px solid rgba(255,255,255,0.05); padding:4px; }
#batchTableWrap { scrollbar-width: thin; scrollbar-color: #fcc929 #111; }
#batchTableWrap::-webkit-scrollbar { height: 8px; }
#batchTableWrap::-webkit-scrollbar-track { background: #111; }
#batchTableWrap::-webkit-scrollbar-thumb { background: #fcc929; border-radius: 4px; }

.date-btn-new {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
  transition: border-color 0.15s;
}
.date-btn-new:hover { border-color: rgba(252,201,41,0.3); }
.date-header-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.date-header-row .date-num {
  font-size: 1rem; font-weight: 900; color: var(--white); flex-shrink: 0;
}
.date-day-venue {
  font-size: 0.75rem; color: #aaa; flex: 1; line-height: 1.7; font-weight: 500;
}
.date-check-row {
  display: grid; grid-template-columns: 1fr 1fr;
}
.date-check-box {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 6px; cursor: pointer;
  font-size: 0.78rem; font-weight: 700;
  border-right: 1px solid var(--border);
  transition: all 0.15s; color: var(--gray);
}
.date-check-box:last-child { border-right: none; }
.date-check-box:hover { background: rgba(255,255,255,0.04); }
.date-check-box.checked-team {
  background: rgba(36,110,88,0.2); color: #3aab6e;
}
.date-check-box.checked-small {
  background: rgba(252,201,41,0.15); color: var(--yellow);
}
.check-label { font-size: 0.65rem; letter-spacing: 1px; }

/* MOBILE BOTTOM NAV */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #0a0a0a; border-top: 1px solid rgba(252,201,41,0.15);
  z-index: 49; padding: 8px 0;
}
@media(max-width:768px) { .mobile-nav { display: flex; } }
.mobile-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 6px 4px; cursor: pointer;
  background: none; border: none; color: var(--gray);
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.65rem;
  transition: color 0.15s;
}
.mobile-nav-btn.active { color: var(--yellow); }
.mobile-nav-btn .nav-icon { font-size: 1.2rem; }

/* BACK BUTTON */
.back-fab {
  display: none;
  position: fixed; bottom: 72px; right: 16px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--yellow); color: var(--black);
  border: none; font-size: 1.1rem; cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  z-index: 49; align-items: center; justify-content: center;
}
@media(max-width:768px) { .back-fab { display: flex; } }

/* SYNC TIME */
#syncTime { font-size: 0.65rem; color: #555; }

/* Extra bottom padding on mobile for nav */
@media(max-width:768px) {
  .main { padding-bottom: 60px; }
}

.edit-only { display: none !important; }
body.edit-mode .edit-only { display: inline-block !important; }

/* NEGATIVE WARNING */
.neg-warning {
  background: rgba(224,92,42,0.1); border: 1px solid rgba(224,92,42,0.3);
  border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
  font-size: 0.82rem; color: var(--red);
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">🐺 黑狼出席管理</div>
  <div id="lockStatus" style="font-size:0.78rem;cursor:pointer;" onclick="toggleEdit()"></div>
  <button id="syncBtn" class="btn btn-green" onclick="syncToGist()" style="font-size:0.78rem;display:none;">☁ 同步</button>

  <button class="btn btn-outline edit-only" onclick="recalcPrevBalance()" style="font-size:0.8rem;border-color:rgba(252,201,41,0.4);color:#fcc929;">🔄 重算上月結餘</button>
  <button class="btn edit-only" onclick="showTopupForm(state.selectedStudent || '')" style="font-size:0.8rem;background:var(--green);">💳 儲值</button>

  <div class="topbar-month">
    <input type="month" id="currentMonth" value="2026-04" onchange="changeMonth()" style="display:none;">
    <select id="monthSelect" onchange="changeMonthSelect(this.value)" style="background:#fcc929;border:none;color:#010101;padding:7px 14px;border-radius:4px;font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:0.85rem;cursor:pointer;">
    <option value="2026-01">2026年 1月</option>

    <option value="2026-08">2026年 8月</option>
    <option value="2026-09">2026年 9月</option>
    <option value="2026-10">2026年10月</option>
    <option value="2026-11">2026年11月</option>
    <option value="2026-12">2026年12月</option>
    <option value="2027-01">2027年 1月</option>
    <option value="2027-02">2027年 2月</option>
    <option value="2027-03">2027年 3月</option>
    <option value="2027-04">2027年 4月</option>
    <option value="2027-05">2027年 5月</option>
    <option value="2027-06">2027年 6月</option>
    <option value="2027-07">2027年 7月</option>
    <option value="2027-08">2027年 8月</option>
    <option value="2027-09">2027年 9月</option>
    <option value="2027-10">2027年10月</option>
    <option value="2027-11">2027年11月</option>
    <option value="2027-12">2027年12月</option>

function showTopupForm(name) {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
  document.getElementById('batchModal').style.display = 'none';
  const modal = document.getElementById('topupModal');
  document.body.appendChild(modal);
  modal.style.display = 'flex';
  const displayName = name || (state.selectedStudent || '');
  document.getElementById('topupStudentName').textContent = displayName ? '學員：' + displayName : '（請從左側選擇學員）';
  document.getElementById('tpRef').value = '';
  document.getElementById('tpMoney').value = '';
  document.getElementById('tpTeamAmount').value = '';
  document.getElementById('tpSmallAmount').value = '';
  document.getElementById('tpNote').value = '';
  document.getElementById('tpDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('tpIsTeam').checked = false;
  document.getElementById('tpIsSmall').checked = false;
  if (document.getElementById('tpIsPrivate')) document.getElementById('tpIsPrivate').checked = false;
  if (document.getElementById('tpPrivateAmount')) document.getElementById('tpPrivateAmount').value = '';
  document.querySelector('input[name=tpMethod][value="轉帳"]').checked = true;
  tpUpdate();
}

function tpClose() {
  document.getElementById('topupModal').style.display = 'none';
}

function tpUpdate() {
  const isTeam = document.getElementById('tpIsTeam').checked;
  const isSmall = document.getElementById('tpIsSmall').checked;
  const isPrivate = document.getElementById('tpIsPrivate') ? document.getElementById('tpIsPrivate').checked : false;
  document.getElementById('tpTeamSection').style.display = isTeam ? '' : 'none';
  document.getElementById('tpSmallSection').style.display = isSmall ? '' : 'none';
  if (document.getElementById('tpPrivateSection')) document.getElementById('tpPrivateSection').style.display = isPrivate ? '' : 'none';
  const method = document.querySelector('input[name=tpMethod]:checked').value;
  const refGroup = document.getElementById('tpRefGroup');
  const refLabel = document.getElementById('tpRefLabel');
  const refInput = document.getElementById('tpRef');
  if (method === '轉帳') { refGroup.style.display=''; refLabel.textContent='後五碼'; refInput.placeholder='請輸入轉帳後五碼'; }
  else if (method === 'LINE PAY') { refGroup.style.display=''; refLabel.textContent='LINE 名字'; refInput.placeholder='請輸入 LINE 顯示名稱'; }
  else { refGroup.style.display='none'; }
  const date = document.getElementById('tpDate').value;
  const periodHint = document.getElementById('tpPeriodHint');
  if (date) {
    const day = parseInt(date.split('-')[2]);
    const _ym = document.getElementById('tpDate').value.slice(0,7);
    let _hint = '';
    if (day <= 5) {
      const _prev = _ym === state.currentMonth
        ? (() => { const d = new Date(_ym+'-01'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })()
        : _ym.slice(0,7);
      _hint = '→ 將計入「' + _prev.replace('-','年') + '月 月底儲值」';
    } else if (day <= 15) {
      _hint = '→ 將計入「本月月中儲值」';
    } else {
      _hint = '→ 將計入「本月月底儲值」';
    }
    periodHint.textContent = _hint;
  } else { periodHint.textContent = ''; }
  const name = document.getElementById('topupStudentName').textContent.replace('學員：','');
  const ref = document.getElementById('tpRef').value.trim();
  const money = document.getElementById('tpMoney').value;
  const teamAmt = document.getElementById('tpTeamAmount').value;
  const smallAmt = document.getElementById('tpSmallAmount').value;
  const note = document.getElementById('tpNote').value.trim();
  const days = ['日','一','二','三','四','五','六'];
  let lines = [];
  if (name) lines.push('學員：' + name);
  if (date) { const dt = new Date(date+'T00:00:00'); lines.push('日期：' + date.replace(/-/g,'/') + '（週' + days[dt.getDay()] + '）'); }
  lines.push('方式：' + method + (ref ? '（' + ref + '）' : ''));
  if (money) lines.push('金額：NT$' + money);
  const privateAmt = document.getElementById('tpPrivateAmount') ? document.getElementById('tpPrivateAmount').value : '';
  if (isTeam && teamAmt) lines.push('● 團課 +' + teamAmt + ' 堂');
  if (isSmall && smallAmt) lines.push('◆ 小班 +' + smallAmt + ' 堂');
  if (isPrivate && privateAmt) lines.push('★ 私課 +' + privateAmt + ' 堂');
  if (note) lines.push('備註：' + note);
  document.getElementById('tpPreview').textContent = lines.join('\n');
}

function tpSave() {
  const nameEl = document.getElementById('topupStudentName').textContent.replace('學員：','').trim();
  if (!nameEl) { alert('請選擇學員'); return; }
  const date = document.getElementById('tpDate').value;
  if (!date) { alert('請填寫匯款日期'); return; }
  const isTeam = document.getElementById('tpIsTeam').checked;
  const isSmall = document.getElementById('tpIsSmall').checked;
  const isPrivateTp = document.getElementById('tpIsPrivate') ? document.getElementById('tpIsPrivate').checked : false;
  if (!isTeam && !isSmall && !isPrivateTp) { alert('請選擇課程類型'); return; }
  const teamAmt = parseInt(document.getElementById('tpTeamAmount').value) || 0;
  const smallAmt = parseInt(document.getElementById('tpSmallAmount').value) || 0;
  const privateAmt = isPrivateTp && document.getElementById('tpPrivateAmount') ? (parseInt(document.getElementById('tpPrivateAmount').value) || 0) : 0;
  if (isTeam && teamAmt === 0 && !isSmall && !isPrivateTp) { alert('請填寫團課儲值堂數'); return; }
  if (isSmall && smallAmt === 0 && !isTeam && !isPrivateTp) { alert('請填寫小班儲值堂數'); return; }
  if (isPrivateTp && privateAmt === 0 && !isTeam && !isSmall) { alert('請填寫私課儲值堂數'); return; }
  const day = parseInt(date.split('-')[2]);
  const dateYM = date.slice(0,7);
  let period, targetMonth;
  if (day <= 5) {
    // previous month end
    const d = new Date(dateYM+'-01');
    d.setMonth(d.getMonth()-1);
    targetMonth = d.toISOString().slice(0,7);
    period = 'end';
  } else if (day <= 15) {
    targetMonth = dateYM;
    period = 'mid';
  } else {
    targetMonth = dateYM;
    period = 'end';
  }
  const method = document.querySelector('input[name=tpMethod]:checked').value;
  const ref = document.getElementById('tpRef').value.trim();
  const money = parseInt(document.getElementById('tpMoney').value) || 0;
  const note = document.getElementById('tpNote').value.trim();
  // Use targetMonth (may be previous month if date ≤ 5)
  if (!state.months[targetMonth]) state.months[targetMonth] = { dates: [], students: [] };
  const targetData = state.months[targetMonth];
  let ts = targetData.students.find(x => x.name === nameEl);
  if (!ts) {
    // 找其他月份的學員資料作為參考
    const refMonths = Object.keys(state.months).sort().reverse();
    let refStudent = null;
    for (const m of refMonths) {
      refStudent = state.months[m].students.find(x => x.name === nameEl);
      if (refStudent) break;
    }
    if (!refStudent) { alert('找不到學員'); return; }
    // 加入 targetMonth，保留現有的 topup 欄位
    targetData.students.push(Object.assign({}, refStudent, {
      attended: [], midTopup: 0, endTopup: 0,
      scMidTopup: 0, scTopup: 0, scDates: [],
      prevBalance: refStudent.prevBalance || 0,
      scPrevBal: refStudent.scPrevBal || 0,
    }));
    ts = targetData.students.find(x => x.name === nameEl);
  }
  if (isTeam && teamAmt > 0) {
    if (period === 'mid') ts.midTopup = (ts.midTopup||0) + teamAmt;
    else ts.endTopup = (ts.endTopup||0) + teamAmt;
  }
  if (isSmall && smallAmt > 0) {
    if (period === 'mid') ts.scMidTopup = (ts.scMidTopup||0) + smallAmt;
    else ts.scTopup = (ts.scTopup||0) + smallAmt;
  }
  if (isPrivateTp && privateAmt > 0) {
    if (period === 'mid') ts.privateMidTopup = (ts.privateMidTopup||0) + privateAmt;
    else ts.privateTopup = (ts.privateTopup||0) + privateAmt;
  }
  if (!state.paymentHistory) state.paymentHistory = [];
  state.paymentHistory.push({ id: Date.now(), name: nameEl, date, method, ref, money, teamAmt: isTeam ? teamAmt : 0, smallAmt: isSmall ? smallAmt : 0, privateAmt: isPrivateTp ? privateAmt : 0, period, month: targetMonth, note });
  saveState();
  tpClose();
  renderSidebar();
  renderPanel();
  alert('✓ 儲值已登錄！');
}

    + '</div>'

function phUpdateRecord(el) {
  if (state.isReadOnly) return;
  const id = parseInt(el.dataset.id);
  const field = el.dataset.field;
  const val = el.type === 'number' ? (parseInt(el.value)||0) : el.value;
  const rec = (state.paymentHistory||[]).find(p => p.id === id);
  if (!rec) return;

  const oldTeamAmt = rec.teamAmt || 0;
  const oldSmallAmt = rec.smallAmt || 0;
  const oldPrivateAmt = rec.privateAmt || 0;
  const oldPeriod = rec.period;
  const oldMonth = rec.month;

  // Reverse old topup from old month
  const oldData = state.months[oldMonth];
  if (oldData) {
    const s = oldData.students.find(x => x.name === rec.name);
    if (s) {
      if (oldPeriod === 'mid') { s.midTopup = Math.max(0,(s.midTopup||0)-oldTeamAmt); s.scMidTopup = Math.max(0,(s.scMidTopup||0)-oldSmallAmt); s.privateMidTopup = Math.max(0,(s.privateMidTopup||0)-oldPrivateAmt); }
      else { s.endTopup = Math.max(0,(s.endTopup||0)-oldTeamAmt); s.scTopup = Math.max(0,(s.scTopup||0)-oldSmallAmt); s.privateTopup = Math.max(0,(s.privateTopup||0)-oldPrivateAmt); }
    }
  }

  // Update record field
  rec[field] = val;

  // If date changed, recalculate period (unless period was manually set)
  if (field === 'date') {
    const day = parseInt(val.split('-')[2]);
    rec.period = day <= 5 ? 'end' : day <= 15 ? 'mid' : 'end';
  }

  // Apply new topup to new month
  const newData = state.months[rec.month];
  if (newData) {
    let s = newData.students.find(x => x.name === rec.name);
    if (!s) {
      // Try to find student from any month and add to target month
      const refMonths = Object.keys(state.months).sort().reverse();
      let ref = null;
      for (const m of refMonths) {
        ref = state.months[m].students.find(x => x.name === rec.name);
        if (ref) break;
      }
      if (ref) {
        newData.students.push(Object.assign({}, ref, { attended:[], midTopup:0, endTopup:0, scMidTopup:0, scTopup:0, scDates:[] }));
        s = newData.students.find(x => x.name === rec.name);
      }
    }
    if (s) {
      const newTeam = rec.teamAmt || 0;
      const newSmall = rec.smallAmt || 0;
      const newPrivate = rec.privateAmt || 0;
      if (rec.period === 'mid') { s.midTopup = (s.midTopup||0)+newTeam; s.scMidTopup = (s.scMidTopup||0)+newSmall; s.privateMidTopup = (s.privateMidTopup||0)+newPrivate; }
      else { s.endTopup = (s.endTopup||0)+newTeam; s.scTopup = (s.scTopup||0)+newSmall; s.privateTopup = (s.privateTopup||0)+newPrivate; }
    }
  }

  saveState();
  renderSidebar();
  _renderPaymentHistory();
}

function phDeleteRecord(id) {
  if (state.isReadOnly) return;
  if (!confirm('確定刪除這筆匯款紀錄？')) return;
  const rec = (state.paymentHistory||[]).find(p => p.id === id);
  if (rec) {
    // Reverse the topup from student data
    const data = state.months[rec.month];
    if (data) {
      const s = data.students.find(x => x.name === rec.name);
      if (s) {
        if (rec.period === 'mid') { s.midTopup = Math.max(0,(s.midTopup||0)-(rec.teamAmt||0)); s.scMidTopup = Math.max(0,(s.scMidTopup||0)-(rec.smallAmt||0)); s.privateMidTopup = Math.max(0,(s.privateMidTopup||0)-(rec.privateAmt||0)); }
        else { s.endTopup = Math.max(0,(s.endTopup||0)-(rec.teamAmt||0)); s.scTopup = Math.max(0,(s.scTopup||0)-(rec.smallAmt||0)); s.privateTopup = Math.max(0,(s.privateTopup||0)-(rec.privateAmt||0)); }
      }
    }
    state.paymentHistory = state.paymentHistory.filter(p => p.id !== id);
  }
  saveState();
  renderSidebar();
  _renderPaymentHistory();
}

function addNewCoachToList(inputId, listId, inputName) {
  const input = document.getElementById(inputId);
  const name = input.value.trim();
  if (!name) return;
  // Add to all coach lists with same inputName pattern across both modals
  const allListIds = {
    'newTeamCoach':     ['newTeamCoachList',    'editTeamCoachList'],
    'editTeamCoach':    ['newTeamCoachList',    'editTeamCoachList'],
    'newSmallCoach':    ['newSmallCoachList',   'editSmallCoachList'],
    'editSmallCoach':   ['newSmallCoachList',   'editSmallCoachList'],
    'newPrivateCoach':  ['newPrivateCoachList', 'editPrivateCoachList'],
    'editPrivateCoach': ['newPrivateCoachList', 'editPrivateCoachList'],
  };
  const targets = allListIds[inputName] || [listId];
  targets.forEach(lid => {
    const list = document.getElementById(lid);
    if (!list) return;
    let resolvedName;
    if (inputName.includes('Team')) resolvedName = lid.startsWith('new') ? 'newTeamCoach' : 'editTeamCoach';
    else if (inputName.includes('Small')) resolvedName = lid.startsWith('new') ? 'newSmallCoach' : 'editSmallCoach';
    else resolvedName = lid.startsWith('new') ? 'newPrivateCoach' : 'editPrivateCoach';
    if (list.querySelector('[data-coach="' + name + '"]')) return;
    list.appendChild(makeCoachLabel(name, resolvedName, lid === listId));
  });
  // Save custom coach
  const defaultCoaches = ['馬哥','松育','芃宜','子豪','紹詠'];
  if (!defaultCoaches.includes(name)) {
    const coaches = JSON.parse(localStorage.getItem('bw_coaches') || '[]');
    if (!coaches.includes(name)) { coaches.push(name); localStorage.setItem('bw_coaches', JSON.stringify(coaches)); }
  }
  // Also remove from deleted list if re-adding
  const deleted = JSON.parse(localStorage.getItem('bw_deleted_coaches') || '[]');
  if (deleted.includes(name)) { localStorage.setItem('bw_deleted_coaches', JSON.stringify(deleted.filter(c => c !== name))); }
  input.value = '';
}

function overviewUpdateTopup(name, type, val) {

  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  const n = parseInt(val) || 0;
  if (type === 'prevBalance') s.prevBalance = n;
  else if (type === 'mid') s.midTopup = n;
  else if (type === 'end') s.endTopup = n;
  else if (type === 'scMid') s.scMidTopup = n;
  else if (type === 'scTopup') s.scTopup = n;
  else if (type === 'scPrevBal') s.scPrevBal = n;
  else if (type === 'privatePrevBal') s.privatePrevBal = n;
  else if (type === 'privateMid') s.privateMidTopup = n;
  else if (type === 'privateTopup') s.privateTopup = n;
  else if (type === 'privateGift') s.privateGiftTopup = n;
  saveState();
  renderSidebar();
}

function recalcPrevBalance() {
  if (state.isReadOnly) return;
  const allMonths = Object.keys(state.months).sort();
  const curIdx = allMonths.indexOf(state.currentMonth);
  if (curIdx <= 0) { alert('目前是最早的月份，沒有上個月可以計算。'); return; }
  const prevMonth = allMonths[curIdx - 1];
  const prevData = state.months[prevMonth];
  const curData = state.months[state.currentMonth];
  if (!prevData || !curData) return;

  let updated = 0;
  const updatedNames = [];
  curData.students.forEach(s => {
    const prev = prevData.students.find(x => x.name === s.name);
    if (!prev) return;
    const newTeamBal = calcEndBalance(prev);
    const newScBal = (prev.scPrevBal||0) + (prev.scMidTopup||0) + (prev.scTopup||0) + (prev.scGiftTopup||0) - (prev.scDates ? prev.scDates.length : (prev.scAttended||0));
    const newPrivBal = calcPrivateBalance(prev);
    if (s.prevBalance !== newTeamBal || s.scPrevBal !== newScBal || s.privatePrevBal !== newPrivBal) {
      s.prevBalance = newTeamBal;
      s.scPrevBal = newScBal;
      s.privatePrevBal = newPrivBal;
      updated++;
      updatedNames.push(s.name);
    }
  });

  saveState();
  renderSidebar();
  const nameList = updatedNames.length > 0 ? '\n\n更新名單：\n' + updatedNames.join('、') : '';
  alert('✓ 已重算完成！共更新 ' + updated + ' 位學員的上月結餘。\n（依據 ' + prevMonth.replace('-','年') + '月 的資料）' + nameList);
}

        '<td style="' + privColor + '">' + (privateActual>0||(s.privateTopup||0)>0||(s.privatePrevBal||0)!==0 ? (privBal>=0?'+':'')+privBal : '—') + '</td>' +
        '<td style="color:var(--gray);font-size:0.78rem;">' + (s.note||'') + '</td>' +
        '</tr>';
    });
  });
  tableHtml += '</tbody></table>';

  document.getElementById('overviewContent').innerHTML = prevWarnHtml + tableHtml;
  const _moverviewModal = document.getElementById('overviewModal'); document.body.appendChild(_moverviewModal); _moverviewModal.classList.add('show');
}

function copyDebtList() {
  const data = getCurrentMonthData();
  const monthLabel = state.currentMonth.replace('-', '年') + '月';
  const showTeam = document.getElementById('debtFilterTeam') ? document.getElementById('debtFilterTeam').checked : true;
  const showSmall = document.getElementById('debtFilterSmall') ? document.getElementById('debtFilterSmall').checked : true;
  const showPrivate = document.getElementById('debtFilterPrivate') ? document.getElementById('debtFilterPrivate').checked : true;
  const groupOrder = ['幼兒','小一','小二','小三','小四','小五','小六','國中','爸媽組'];

  const debtStudents = data.students
    .filter(s => {
      if (s.group === '已離隊') return false;
      const teamBal = calcEndBalance(s);
      const scActual = s.scDates ? (Array.isArray(s.scDates) ? s.scDates.length : 0) : (s.scAttended||0);
      const scBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActual;
      const privBal = calcPrivateBalance(s);
      if (showTeam && teamBal < 0) return true;
      if (showSmall && scBal < 0) return true;
      if (showPrivate && privBal < 0) return true;
      return false;
    })
    .sort((a, b) => {
      const ai = groupOrder.indexOf(a.group);
      const bi = groupOrder.indexOf(b.group);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

  if (debtStudents.length === 0) { alert('本月沒有堂數不足的學員！'); return; }

  const lines = ['[' + monthLabel + ' 堂數不足名單]', ''];
  let lastGroup = '';
  debtStudents.forEach(s => {
    const teamBal = calcEndBalance(s);
    const scActual = s.scDates ? (Array.isArray(s.scDates) ? s.scDates.length : 0) : (s.scAttended||0);
    const scBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActual;
    if (s.group !== lastGroup) {
      if (lastGroup) lines.push('');
      lines.push('【' + s.group + '】');
      lastGroup = s.group;
    }
    const parts = [];
    if (showTeam && teamBal < 0) parts.push('團課差 ' + Math.abs(teamBal) + ' 堂');
    if (showSmall && scBal < 0) parts.push('小班差 ' + Math.abs(scBal) + ' 堂');
    lines.push('・' + s.name + '　' + parts.join(' / '));
  });
  lines.push('');
  lines.push('請盡快完成儲值，謝謝！');
  navigator.clipboard.writeText(lines.join('\n')).then(() => alert('已複製到剪貼簿！'));
}

function renderBatch() {
  const data = getCurrentMonthData();
  const monthLabel = state.currentMonth.replace('-', '年') + '月';
  const _lbl = document.getElementById('batchMonthLabel'); if (_lbl) _lbl.textContent = monthLabel;
  const selectedGroups = getSelectedGroups ? getSelectedGroups() : null;
  const tabs = state._batchTabs || { team: true, small: false, private: false };
  const courseFilter = (tabs.team && tabs.small && tabs.private) ? 'all'
    : (tabs.team && tabs.private) ? 'team+private'
    : (tabs.small && tabs.private) ? 'small+private'
    : (tabs.team && tabs.small) ? 'team+small'
    : tabs.private ? 'private'
    : tabs.small ? 'small'
    : 'team';
  const attendedOnly = document.getElementById('batchAttendedBtn') && document.getElementById('batchAttendedBtn').classList.contains('active');
  const dates = data.dates;
  let filteredDates = dates.filter(d => {
    if (courseFilter === 'all') return d.isTeam || d.isSmall || d.isPrivate;
    if (courseFilter === 'team+small') return d.isTeam || d.isSmall;
    if (courseFilter === 'team+private') return d.isTeam || d.isPrivate;
    if (courseFilter === 'small+private') return d.isSmall || d.isPrivate;
    if (courseFilter === 'team') return !!d.isTeam;
    if (courseFilter === 'small') return !!d.isSmall;
    if (courseFilter === 'private') return !!d.isPrivate;
    return d.isTeam || d.isSmall;
  });
  const batchSearchEl = document.getElementById('batchSearch');
  const searchVal = batchSearchEl ? batchSearchEl.value.toLowerCase() : '';
  const debtOnly = document.getElementById('batchDebtBtn') && document.getElementById('batchDebtBtn').classList.contains('active');
  let students = data.students.filter(s => s.group !== '已離隊' && (!s.isTrial || s.trialMonth === state.currentMonth));
  if (selectedGroups) students = students.filter(s => selectedGroups.includes(s.group));
  if (searchVal) students = students.filter(s => [...searchVal].every(c => s.name.includes(c)) || (s.bib||'').includes(searchVal));
  if (debtOnly) students = students.filter(s => calcEndBalance(s) < 0);
  if (attendedOnly) {
    students = students.filter(s => {
      const teamCount = (s.attended||[]).filter(a => filteredDates.find(d => (d.uid||d.date) === a)).length;
      const scCount = (s.scDates||[]).filter(a => filteredDates.find(d => (d.uid||d.date) === a)).length;
      const pvCount = (s.privateDates||[]).filter(a => filteredDates.find(d => (d.uid||d.date) === a)).length;
      if (courseFilter === 'team') return teamCount > 0;
      if (courseFilter === 'small') return scCount > 0;
      if (courseFilter === 'private') return pvCount > 0;
      if (courseFilter === 'team+private') return teamCount > 0 || pvCount > 0;
      if (courseFilter === 'small+private') return scCount > 0 || pvCount > 0;
      if (courseFilter === 'team+small') return teamCount > 0 || scCount > 0;
      return teamCount > 0 || scCount > 0 || pvCount > 0;
    });
  }

  // Header: 學員 | 上月結餘 | 月中儲值 | [課日...] | 合計 | 月底儲值 | 月底剩餘
  const days = ['日','一','二','三','四','五','六'];
  const simpleMode = document.getElementById('batchSimpleBtn') && document.getElementById('batchSimpleBtn').classList.contains('active');

  // Group students
  const groups = {};
  students.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  // Date totals
  const dateTotals = {};
  const dateSmallTotals = {};
  const datePrivateTotals = {};
  filteredDates.forEach(d => { const k = d.uid||d.date; dateTotals[k] = 0; dateSmallTotals[k] = 0; datePrivateTotals[k] = 0; });
  students.forEach(s => {
    (s.attended||[]).forEach(a => { if (dateTotals[a] !== undefined) dateTotals[a]++; });
    (s.scDates||[]).forEach(a => { if (dateSmallTotals[a] !== undefined) dateSmallTotals[a]++; });
    (s.privateDates||[]).forEach(a => { if (datePrivateTotals[a] !== undefined) datePrivateTotals[a]++; });
  });

  // 只在「有上課」模式下，過濾掉選定學員中沒人出席的課日
  if (attendedOnly) {
    const showTeamF = courseFilter === 'team' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'team+private';
    const showSmallF = courseFilter === 'small' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'small+private';
    const showPrivateF = courseFilter === 'private' || courseFilter === 'team+private' || courseFilter === 'small+private' || courseFilter === 'all';
    filteredDates = filteredDates.filter(d => {
      const k = d.uid||d.date;
      if (showTeamF && dateTotals[k] > 0) return true;
      if (showSmallF && dateSmallTotals[k] > 0) return true;
      if (showPrivateF && datePrivateTotals[k] > 0) return true;
      return false;
    });
  }

  let thead = '<thead><tr>';
  thead += '<th class="batch-name-th" style="min-width:120px;">學員</th>';
  if (!simpleMode) thead += '<th class="batch-th" style="min-width:64px;color:#fcc929;">上月結餘</th>';
  if (!simpleMode) thead += '<th class="batch-th" style="min-width:64px;color:#3aab6e;">月中儲值</th>';
  filteredDates.forEach(d => {
    const dt = new Date(d.date + 'T00:00:00');
    const tc = d.teamCoach || d.coach || '';
    const sc = d.smallCoach || '';
    const showTeamCoach = courseFilter === 'team' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'team+private';
    const showSmallCoach = courseFilter === 'small' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'small+private';
    const showPrivateCoach = courseFilter === 'private' || courseFilter === 'team+private' || courseFilter === 'small+private' || courseFilter === 'all';
    let coachHtml = '';
    if (showTeamCoach) {
      if (d.venue) coachHtml += '<br><span style="color:#555;font-size:0.6rem;">' + d.venue + '</span>';
      if (tc) coachHtml += '<br><span style="color:#3aab6e;font-size:0.6rem;">● ' + tc + '</span>';
    }
    if (showSmallCoach) {

      if (sc) coachHtml += '<br><span style="color:#fcc929;font-size:0.6rem;">◆ ' + sc + '</span>';

    if (showPrivateCoach) {
      const pv = d.privateVenue || (showTeamCoach ? '' : d.venue) || '';

            'style="width:48px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--white);text-align:center;border-radius:3px;padding:2px;font-size:0.72rem;display:block;margin-bottom:2px;" ' +
            'data-name="' + s.name + '" data-type="end" onchange="batchUpdateTopup(this)">' : '') +
            (showSmall ? '<input type="number" value="' + (s.scTopup||0) + '" min="0" placeholder="小" ' +
            'style="width:48px;background:rgba(252,201,41,0.05);border:1px solid rgba(252,201,41,0.15);color:#a08010;text-align:center;border-radius:3px;padding:2px;font-size:0.72rem;display:block;margin-bottom:2px;" ' +

            (showPrivate ? '<input type="number" value="' + (s.privateTopup||0) + '" min="0" placeholder="私" ' +
            'style="width:48px;background:rgba(167,139,250,0.05);border:1px solid rgba(167,139,250,0.2);color:#a78bfa;text-align:center;border-radius:3px;padding:2px;font-size:0.72rem;display:block;" ' +
            'data-name="' + s.name + '" data-type="privateTopup" onchange="batchUpdateTopup(this)">' : '') +
            '</td>';
        }
      }
      // 月底剩餘
      if (!simpleMode) {
        let balCell = '';
        if (showTeam) balCell += '<div style="' + balColor + 'font-size:0.72rem;">團' + (endBal>=0?'+':'') + endBal + '</div>';
        if (showSmall) {
          const hasSmallData = scActual > 0 || (s.scTopup||0) > 0 || (s.scPrevBal||0) !== 0 || (s.scMidTopup||0) > 0;
          if (hasSmallData) balCell += '<div style="' + scBalColor + 'font-size:0.72rem;">小' + (scEndBal>=0?'+':'') + scEndBal + '</div>';
        }
        const privBal2 = calcPrivateBalance(s);
        if (showPrivate) {
          const hasPrivData = (s.privateDates||[]).length > 0 || (s.privateTopup||0) > 0 || (s.privatePrevBal||0) !== 0 || (s.privateMidTopup||0) > 0;
          if (hasPrivData) {
            const privBalColor2 = privBal2 < 0 ? 'color:var(--red)' : 'color:#a78bfa';
            balCell += '<div style="' + privBalColor2 + ';font-size:0.72rem;">私' + (privBal2>=0?'+':'') + privBal2 + '</div>';
          }
        }
        tbody += '<td class="batch-td" data-bal-name="' + s.name + '">' + balCell + '</td>';
      }
      tbody += '</tr>';
    });
  });

  // 出席人數列 — 跟著 courseFilter 決定顯示哪幾列，合計欄加總
  const totalTeam = filteredDates.reduce((sum, d) => sum + (dateTotals[d.uid||d.date]||0), 0);
  const totalSmall = filteredDates.reduce((sum, d) => sum + (dateSmallTotals[d.uid||d.date]||0), 0);
  const totalPrivate = filteredDates.reduce((sum, d) => sum + (datePrivateTotals[d.uid||d.date]||0), 0);
  const showTeamRow = courseFilter === 'team' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'team+private';
  const showSmallRow = courseFilter === 'small' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'small+private';
  const showPrivateRow = courseFilter === 'private' || courseFilter === 'team+private' || courseFilter === 'small+private' || courseFilter === 'all';
  if (showTeamRow) {
    tbody += '<tr class="batch-total-row"><td style="text-align:left;padding-left:12px;color:#3aab6e;">團課人數</td>' + (simpleMode ? '' : '<td></td><td></td>');
    filteredDates.forEach(d => { const k=d.uid||d.date; tbody += '<td style="color:#3aab6e;">' + (dateTotals[k]||0) + '</td>'; });
    tbody += '<td style="color:#3aab6e;font-weight:900;">' + totalTeam + '</td>' + (simpleMode ? '' : '<td></td><td></td>') + '</tr>';
  }
  if (showSmallRow) {
    tbody += '<tr class="batch-total-row"><td style="text-align:left;padding-left:12px;color:#fcc929;">小班人數</td>' + (simpleMode ? '' : '<td></td><td></td>');
    filteredDates.forEach(d => { const k=d.uid||d.date; tbody += '<td style="color:#fcc929;">' + (dateSmallTotals[k]||0) + '</td>'; });
    tbody += '<td style="color:#fcc929;font-weight:900;">' + totalSmall + '</td>' + (simpleMode ? '' : '<td></td><td></td>') + '</tr>';
  }
  if (showPrivateRow) {
    tbody += '<tr class="batch-total-row"><td style="text-align:left;padding-left:12px;color:#a78bfa;">私課人數</td>' + (simpleMode ? '' : '<td></td><td></td>');
    filteredDates.forEach(d => { const k=d.uid||d.date; tbody += '<td style="color:#a78bfa;">' + (datePrivateTotals[k]||0) + '</td>'; });
    tbody += '<td style="color:#a78bfa;font-weight:900;">' + totalPrivate + '</td>' + (simpleMode ? '' : '<td></td><td></td>') + '</tr>';
  }
  tbody += '</tbody>';

  document.getElementById('batchTable').innerHTML = thead + tbody;
}

function batchUpdateTopup(input) {
  if (state.isReadOnly) return;
  const name = input.dataset.name;
  const type = input.dataset.type;
  const val = parseInt(input.value) || 0;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (type === 'mid') s.midTopup = val;
  else if (type === 'end') s.endTopup = val;
  else if (type === 'scMid') s.scMidTopup = val;
  else if (type === 'scTopup') s.scTopup = val;
  else if (type === 'privateMid') s.privateMidTopup = val;
  else if (type === 'privateTopup') s.privateTopup = val;
  else if (type === 'privateGift') s.privateGiftTopup = val;
  saveState();
  renderSidebar();
  // 即時更新該列的剩餘欄，不重繪整個表格
  const tabs = state._batchTabs || { team: true, small: false, private: false };
  const courseFilter = (tabs.team && tabs.small && tabs.private) ? 'all'
    : (tabs.team && tabs.private) ? 'team+private'
    : (tabs.small && tabs.private) ? 'small+private'
    : (tabs.team && tabs.small) ? 'team+small'
    : tabs.private ? 'private'
    : tabs.small ? 'small'
    : 'team';
  const endBal = calcEndBalance(s);
  const scActual = s.scDates ? s.scDates.length : (s.scAttended||0);
  const scEndBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActual;
  const balColor = endBal < 0 ? 'color:var(--red);font-weight:700;' : endBal > 0 ? 'color:#3aab6e;' : 'color:var(--gray);';
  const scBalColor = scEndBal < 0 ? 'color:var(--red);' : 'color:#3aab6e;';
  const hasSmallData = scActual > 0 || (s.scTopup||0) > 0 || (s.scPrevBal||0) !== 0 || (s.scMidTopup||0) > 0;
  let balCell = '';
  if (courseFilter !== 'small') balCell += '<div style="' + balColor + 'font-size:0.72rem;">團' + (endBal>=0?'+':'') + endBal + '</div>';
  if (courseFilter !== 'team' && hasSmallData) balCell += '<div style="' + scBalColor + 'font-size:0.72rem;">小' + (scEndBal>=0?'+':'') + scEndBal + '</div>';
  const balTd = document.querySelector('td[data-bal-name="' + name + '"]');
  if (balTd) balTd.innerHTML = balCell;
  // 同步更新學員名稱欄的小字結餘
  const nameBalColor = endBal < 0 ? 'color:var(--red)' : 'color:#3aab6e';
  const scBalColorName = scEndBal < 0 ? 'color:var(--red)' : 'color:#3aab6e';
  const nameTd = document.querySelector('td[data-name-bal="' + name + '"]');
  if (nameTd) {
    const teamDiv = nameTd.querySelector('.bal-team');
    const scDiv = nameTd.querySelector('.bal-sc');
    if (teamDiv) { teamDiv.style.cssText = nameBalColor; teamDiv.textContent = '團 ' + (endBal>=0?'+':'') + endBal + '堂'; }
    if (scDiv && hasSmallData) { scDiv.style.cssText = scBalColorName; scDiv.textContent = '小 ' + (scEndBal>=0?'+':'') + scEndBal + '堂'; }
  }
}

function toggleBatchCell(el) {
  if (state.isReadOnly) return;
  const name = el.dataset.name;
  const date = el.dataset.date;
  const type = el.dataset.type;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (type === 'small') {
    if (!s.scDates) s.scDates = [];
    const idx = s.scDates.indexOf(date);
    if (idx === -1) s.scDates.push(date);
    else s.scDates.splice(idx, 1);
    s.scAttended = s.scDates.length;
  } else if (type === 'private') {
    if (!s.privateDates) s.privateDates = [];
    const idx = s.privateDates.indexOf(date);
    if (idx === -1) s.privateDates.push(date);
    else s.privateDates.splice(idx, 1);
  } else {
    if (!s.attended) s.attended = [];
    const idx = s.attended.indexOf(date);
    if (idx === -1) s.attended.push(date);
    else s.attended.splice(idx, 1);
  }
  saveState();
  renderSidebar();
  renderBatch();
}

function exportCalendar() {
  const data = getCurrentMonthData();
  const [year, month] = state.currentMonth.split('-').map(Number);
  const monthLabel = year + '年' + month + '月';
  const weekDays = ['日','一','二','三','四','五','六'];
  const dayMap = {};
  data.dates.forEach(d => {
    const dateStr = (d.date||'').substring(0,10);
    if (!dateStr.startsWith(state.currentMonth)) return;
    const day = parseInt(dateStr.split('-')[2]);
    if (!dayMap[day]) dayMap[day] = [];
    if (d.isTeam) { const coaches = d.teamCoach || d.coach || ''; const venue = d.venue || ''; dayMap[day].push({ type:'team', label:'● 團課', coaches, venue }); }
    if (d.isSmall) { const coaches = d.smallCoach || ''; const venue = d.smallVenue || ''; dayMap[day].push({ type:'small', label:'◆ 小班', coaches, venue }); }
    if (d.isPrivate) { const coaches = d.privateCoach || ''; const venue = d.privateVenue || ''; dayMap[day].push({ type:'private', label:'★ 私課', coaches, venue }); }
  });
  const firstDow = new Date(year, month-1, 1).getDay();
  const offset = firstDow === 0 ? 6 : firstDow - 1;
  const daysInMonth = new Date(year, month, 0).getDate();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div class="day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(year, month-1, d).getDay();
    const isSat = dow === 6; const isSun = dow === 0;
    const sessions = dayMap[d] || [];
    let sessHtml = sessions.map(s => '<div class="session ' + s.type + '"><div class="slabel">' + s.label + (s.venue ? ' <span class="sv">' + s.venue + '</span>' : '') + '</div>' + (s.coaches ? '<div class="sc">' + s.coaches + '</div>' : '') + '</div>').join('');
    cells += '<div class="day' + (isSat?' sat':'') + (isSun?' sun':'') + '">' + '<div class="dn">' + month + '/' + d + '</div>' + sessHtml + '</div>';
  }

function _exportMultiMonthPDF(months) {
  const tabs = state._batchTabs || { team: true, small: false, private: false };
  const courseFilter = (tabs.team && tabs.small && tabs.private) ? 'all'
    : (tabs.team && tabs.private) ? 'team+private'
    : (tabs.small && tabs.private) ? 'small+private'
    : (tabs.team && tabs.small) ? 'team+small'
    : tabs.private ? 'private'
    : tabs.small ? 'small'
    : 'team';
  const simpleMode = document.getElementById('batchSimpleBtn') && document.getElementById('batchSimpleBtn').classList.contains('active');
  const attendedOnly = document.getElementById('batchAttendedBtn') && document.getElementById('batchAttendedBtn').classList.contains('active');
  const selectedGroups = getSelectedGroups ? getSelectedGroups() : null;
  const days = ['日','一','二','三','四','五','六'];

  // Build one section per month
  let allSections = '';

  months.forEach((month, mIdx) => {
    const data = state.months[month];
    if (!data) return;
    const monthLabel = month.replace('-', '年') + '月';

    let filteredDates = (data.dates||[]).filter(d => {
      if (courseFilter === 'all') return d.isTeam || d.isSmall || d.isPrivate;
      if (courseFilter === 'team+small') return d.isTeam || d.isSmall;
      if (courseFilter === 'team+private') return d.isTeam || d.isPrivate;
      if (courseFilter === 'small+private') return d.isSmall || d.isPrivate;
      if (courseFilter === 'team') return !!d.isTeam;
      if (courseFilter === 'small') return !!d.isSmall;
      if (courseFilter === 'private') return !!d.isPrivate;
      return d.isTeam || d.isSmall;
    });

    const dmShowTeam = courseFilter === 'team' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'team+private';
    const dmShowSmall = courseFilter === 'small' || courseFilter === 'all' || courseFilter === 'team+small' || courseFilter === 'small+private';
    const dmShowPrivate = courseFilter === 'private' || courseFilter === 'team+private' || courseFilter === 'small+private' || courseFilter === 'all';

    let students = (data.students||[]).filter(s => s.group !== '已離隊' && !s.isTrial);
    if (selectedGroups) students = students.filter(s => selectedGroups.includes(s.group));

const GIST_ID = 'adc626cbf7b7f74310f70df17f24c276';
const GITHUB_TOKEN = localStorage.getItem('bw_gh_token') || '';

function syncToGist(callerBtn) {
  let token = localStorage.getItem('bw_gh_token');
  if (!token) {
    token = prompt('請輸入 GitHub Token（只需輸入一次）：');
    if (!token) return;
    localStorage.setItem('bw_gh_token', token);
  }
  const allBtns = [
    callerBtn || null,
    document.getElementById('syncBtn'),
    document.getElementById('batchSyncBtn')
  ].filter((b, i, arr) => b && arr.indexOf(b) === i);
  allBtns.forEach(b => { b.textContent = '☁ 同步中...'; b.disabled = true; });
  const btn = allBtns[0] || document.getElementById('syncBtn');
  const syncState = { ...state, selectedStudent: null };
  const data = JSON.stringify(syncState);
  fetch('https://api.github.com/gists/' + GIST_ID, {
    method: 'PATCH',
    headers: {
      'Authorization': 'token ' + GITHUB_TOKEN,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ files: { 'bwfc.json': { content: data } } })
  })
  .then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error('HTTP ' + r.status + ': ' + (e.message||'')); });
    return r.json();
  })
  .then(() => {
    allBtns.forEach(b => { b.textContent = '✓ 已同步'; });
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    const syncTimeEl = document.getElementById('syncTime');
    if (syncTimeEl) syncTimeEl.textContent = '上次同步 ' + timeStr;
    setTimeout(() => {
      allBtns.forEach(b => { b.textContent = '☁ 同步'; b.disabled = false; });
    }, 2000);
  })
  .catch(e => {
    alert('同步失敗：' + e.message + '\n\n請確認 GitHub Token 是否正確。');
    allBtns.forEach(b => { b.textContent = '☁ 同步'; b.disabled = false; });
  });
}

function loadFromGist() {
  // Check local timestamp first
  const localTs = getLocalTimestamp();
  
  fetch('https://api.github.com/gists/' + GIST_ID)
  .then(r => r.json())
  .then(data => {
    const content = data.files['bwfc.json'].content;
    const parsed = JSON.parse(content);
    const gistTs = parsed._savedAt || 0;
    
    // Use whichever is newer
    if (parsed.months && Object.keys(parsed.months).length > 0) {
      const hasStudents = Object.values(parsed.months).some(m => m.students && m.students.length > 0);
      if (hasStudents) {
        if (localTs > 0 && localTs > gistTs) {
          // Local is newer - use local
          loadLocalState();
          console.log('使用本機資料（較新）');
        } else {
          // Gist is newer - use gist
          const prevReadOnly = state.isReadOnly;
          state = { ...state, ...parsed };
          state.isReadOnly = true;
          state.groupFilter = 'all';
          state.debtFilter = false;
          state.selectedStudent = null;
          try { localStorage.setItem('bw_state', JSON.stringify(state)); } catch(e) {}
          document.getElementById('monthSelect').value = state.currentMonth;
          renderSidebar();
          renderPanel();
          console.log('使用 Gist 資料（較新）');
        }
        return;
      }
    }
    loadLocalState();
  })
  .catch(() => loadLocalState());
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.months) { alert('檔案格式不正確'); return; }
      if (!confirm('匯入後會覆蓋現有資料，確定繼續？')) return;
      state = { ...state, ...parsed };
      state.groupFilter = 'all';
      state.debtFilter = false;
      state.isReadOnly = true;
      state.selectedStudent = null;
      ensureDateUids(state);
      saveState();
      document.getElementById('currentMonth').value = state.currentMonth;
      renderSidebar();
      renderPanel();
      alert('匯入成功！');
    } catch(err) {
      alert('匯入失敗：' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function saveState() {
  if (!state.isReadOnly) {
    state._savedAt = Date.now();
    try { localStorage.setItem('bw_state', JSON.stringify(state)); } catch(e) {}
  }
}

function getCurrentMonthData() {
  if (!state.months[state.currentMonth]) {
    const allMonths = Object.keys(state.months).sort();
    const masterMap = {};
    allMonths.forEach(ym => {
      (state.months[ym].students || []).forEach(s => { masterMap[s.name] = s; });
    });
    const latestPrev = allMonths[allMonths.length - 1];
    const latestStudentMap = {};
    if (latestPrev) {
      (state.months[latestPrev].students || []).forEach(s => { latestStudentMap[s.name] = s; });
    }
    const students = Object.values(masterMap).filter(s => !s.isTrial && s.group !== '已離隊').map(s => {
      const prev = latestStudentMap[s.name] || s;
      return {
        ...s,
        prevBalance: calcEndBalance(prev),
        attended: [],
        midTopup: 0,
        endTopup: 0,
        giftTopup: 0,
        scGiftTopup: 0,
        scMidTopup: 0,
        scPrevBal: ((prev.scPrevBal||0) + (prev.scMidTopup||0) + (prev.scTopup||0) + (prev.scGiftTopup||0) - (prev.scDates ? prev.scDates.length : (prev.scAttended||0))),
        scTopup: 0,
        scAttended: 0,
        scDates: []
      };
    });
    const dates = generateFixedDates(state.currentMonth);
    state.months[state.currentMonth] = { dates, students };
    saveState();
  } else {
    const existingNames = new Set(state.months[state.currentMonth].students.map(s => s.name));
    const allMonths = Object.keys(state.months).sort();
    // 建立每個學員最新狀態的map
    const latestStudentMap = {};
    allMonths.forEach(ym => {
      if (ym === state.currentMonth) return;
      (state.months[ym].students || []).forEach(s => {
        latestStudentMap[s.name] = s; // 後面的月份蓋前面的，取最新狀態
      });
    });
    Object.values(latestStudentMap).forEach(s => {
      if (!existingNames.has(s.name) && s.group !== '已離隊' && !s.isTrial) {
        existingNames.add(s.name);
        state.months[state.currentMonth].students.push({
          ...s,
          prevBalance: 0,
          attended: [],
          midTopup: 0,
          endTopup: 0,
          giftTopup: 0,
          scGiftTopup: 0,
          scMidTopup: 0,
          scPrevBal: 0,
          scTopup: 0,
          scAttended: 0,
          scDates: []
        });
      }
    });
    if (!state.months[state.currentMonth].dates) {
      state.months[state.currentMonth].dates = [];
      saveState();
    }
  }
  return state.months[state.currentMonth];
}

function calcPrivateBalance(s) {
  const actual = (s.privateDates||[]).length;
  return (s.privatePrevBal||0) + (s.privateMidTopup||0) + (s.privateTopup||0) + (s.privateGiftTopup||0) - actual;
}

function calcEndBalance(s) {
  return (s.prevBalance || 0) + (s.midTopup || 0) + (s.endTopup || 0) + (s.giftTopup || 0) - (s.attended ? s.attended.length : 0);
}

function renderSidebar() {
  const data = getCurrentMonthData();
  if (!data || !data.students) return;
  const search = document.getElementById('searchInput').value.toLowerCase();
  let students = data.students;
  if (state.groupFilter !== 'all') students = students.filter(s => s.group === state.groupFilter);
  else students = students.filter(s => s.group !== '已離隊' && !s.isTrial);
  if (search) students = students.filter(s => [...search].every(c => s.name.includes(c)));
  if (state.debtFilter) students = students.filter(s => calcEndBalance(s) < 0 && s.group !== '已離隊');

  const groups = {};
  students.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  let html = '';
  Object.entries(groups).forEach(([g, list]) => {
    html += `<div class="group-header">${g}</div>`;
    list.forEach(s => {
      const bal = calcEndBalance(s);
      const balClass = bal > 0 ? 'balance-pos' : bal < 0 ? 'balance-neg' : 'balance-zero';
      const scActualSB = s.scDates ? s.scDates.length : (s.scAttended||0);
      const scBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActualSB;
      const scBalClass = scBal > 0 ? 'balance-pos' : scBal < 0 ? 'balance-neg' : 'balance-zero';
      const hasSmallClass = scActualSB > 0 || (s.scTopup||0) > 0 || (s.scPrevBal||0) !== 0 || (s.scMidTopup||0) > 0;
      const active = state.selectedStudent === s.name ? 'active' : '';
      html += `<div class="student-item ${active}" onclick="selectStudent('${s.name}')">
        <div>
          <div class="student-name">${s.name}</div>
          <div class="student-meta">${s.group}${s.bib ? ' · #' + s.bib : ''} · 團${s.attended.length}堂${scActualSB > 0 ? ' 小' + scActualSB + '堂' : ''}${(s.privateDates||[]).length > 0 ? ' ★' + s.privateDates.length + '堂' : ''}${s.note ? ' · ' + s.note : ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
          <div class="balance-badge ${balClass}">${bal > 0 ? '+' : ''}${bal}</div>
          ${hasSmallClass ? `<div class="balance-badge ${scBalClass}" style="font-size:0.62rem;">${scBal > 0 ? '+' : ''}${scBal}</div>` : ''}
          ${(s.privateDates||[]).length > 0 || (s.privateTopup||0) > 0 || (s.privatePrevBal||0) !== 0 ? '<div class="balance-badge ' + (calcPrivateBalance(s) < 0 ? 'balance-neg' : calcPrivateBalance(s) > 0 ? 'balance-pos' : 'balance-zero') + '" style="font-size:0.62rem;border-color:rgba(167,139,250,0.5);">' + (calcPrivateBalance(s) > 0 ? '+' : '') + calcPrivateBalance(s) + '</div>' : ''}
        </div>
      </div>`;
    });
  });

  // Trial students — only show in edit mode, only if trialMonth === currentMonth
  if (!state.isReadOnly) {
    const trialStudents = data.students.filter(s => s.isTrial && s.trialMonth === state.currentMonth);
    if (trialStudents.length > 0) {
      html += `<div class="group-header" style="color:#fcc929;border-color:rgba(252,201,41,0.3);">🔍 試上</div>`;
      trialStudents.forEach(s => {
        const active = state.selectedStudent === s.name ? 'active' : '';
        html += `<div class="student-item ${active}" onclick="selectStudent('${s.name}')" style="border-left:2px solid rgba(252,201,41,0.4);">
          <div>
            <div class="student-name" style="color:#fcc929;">${s.name}</div>
            <div class="student-meta">${s.group} · 試上 · ${s.attended.length}堂</div>
          </div>
        </div>`;
      });
    }
  }

  document.getElementById('studentList').innerHTML = html;
}

// ── ACTIONS ───────────────────────────────────────────

function toggleDate(studentName, date, type) {
  if (state.isReadOnly) return;
  const currentTab = state._activeTab || 'attendance';
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === studentName);
  if (!s) return;
  if (type === 'small') {
    if (!s.scDates) s.scDates = [];
    const idx = s.scDates.indexOf(date);
    if (idx === -1) s.scDates.push(date);
    else s.scDates.splice(idx, 1);
    s.scAttended = s.scDates.length;
  } else if (type === 'private') {
    if (!s.privateDates) s.privateDates = [];
    const idx = s.privateDates.indexOf(date);
    if (idx === -1) s.privateDates.push(date);
    else s.privateDates.splice(idx, 1);
  } else {
    if (!s.attended) s.attended = [];
    const idx = s.attended.indexOf(date);
    if (idx === -1) s.attended.push(date);
    else s.attended.splice(idx, 1);
  }
  saveState();
  renderSidebar();
  renderPanel();
  const tab = state._activeTab || 'attendance';
  const tabBtn = document.querySelector(`.tab-btn[onclick*="${tab}"]`);
  const tabContent = document.getElementById('tab-' + tab);
  if (tabBtn && tabContent) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tabBtn.classList.add('active');
    tabContent.classList.add('active');
  }
}

function updateTopup(name, type, val) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  const n = parseInt(val) || 0;
  if (type === 'mid') s.midTopup = n;
  else if (type === 'end') s.endTopup = n;
  else if (type === 'gift') s.giftTopup = n;
  else if (type === 'scGift') s.scGiftTopup = n;
  else if (type === 'scMid') s.scMidTopup = n;
  else if (type === 'scTopup') s.scTopup = n;
  else if (type === 'scAttended') s.scAttended = n;
  else if (type === 'privateMid') s.privateMidTopup = n;
  else if (type === 'privateTopup') s.privateTopup = n;
  else if (type === 'privateGift') s.privateGiftTopup = n;
  saveState();
  renderSidebar();
  renderPanel();
}

function filterStudents() { renderSidebar(); }

function toggleDebtFilter() {
  const btn = document.getElementById('debtFilterBtn');
  state.debtFilter = !state.debtFilter;
  btn.style.background = state.debtFilter ? 'rgba(224,92,42,0.2)' : 'none';
  renderSidebar();
}
function filterGroup(g) { state.groupFilter = g; renderSidebar(); }

function changeMonthSelect(val) {
  document.getElementById('currentMonth').value = val;
  changeMonth();
}

function changeMonth() {
  const prev = state.currentMonth;
  state.currentMonth = document.getElementById('currentMonth').value;
  state.selectedStudent = null;
  // Check if new month - show warning about previous negative balances
  if (!state.months[state.currentMonth]) {
    getCurrentMonthData(); // initialize
    const prevData = state.months[prev];
    if (prevData) {
      const neg = prevData.students.filter(s => calcEndBalance(s) < 0 && s.group !== '已離隊');
      if (neg.length > 0) {
        const names = neg.map(s => s.name + '(' + calcEndBalance(s) + '堂)').join('、');
        setTimeout(() => alert('換月提醒\n\n以下學員上月堂數不足，請確認是否已補繳：\n\n' + names), 300);
      }
    }
  }
  saveState();
  renderSidebar();
  renderPanel();
}

function saveEditDate() {
  if (state.isReadOnly) return;
  const orig = document.getElementById('editDateOrig').value;
  const y = document.getElementById('editDateY').value;
  const m = document.getElementById('editDateM').value;
  const d = document.getElementById('editDateD').value;
  const newDate = y + '-' + m + '-' + d;
  const venue = document.getElementById('editVenue').value;
  const smallVenue = (document.getElementById('editSmallVenue') && document.getElementById('editIsSmall').checked) ? document.getElementById('editSmallVenue').value : '';
  const privateCoach = Array.from(document.querySelectorAll('input[name=editPrivateCoach]:checked')).map(x=>x.value).join('、');
  const privateVenue = (document.getElementById('editPrivateVenue') && document.getElementById('editIsPrivate').checked) ? document.getElementById('editPrivateVenue').value : '';
  const teamCoach = Array.from(document.querySelectorAll('input[name=editTeamCoach]:checked')).map(x=>x.value).join('、');
  const smallCoach = Array.from(document.querySelectorAll('input[name=editSmallCoach]:checked')).map(x=>x.value).join('、');
  const note = (document.getElementById('editDateNote').value || '').trim();
  const isTeam = document.getElementById('editIsTeam').checked;
  const isSmall = document.getElementById('editIsSmall').checked;
  const isPrivate = document.getElementById('editIsPrivate') ? document.getElementById('editIsPrivate').checked : false;
  const data = getCurrentMonthData();
  const idx = data.dates.findIndex(x => (x.uid||x.date) === orig);
  if (idx === -1) return;
  const oldUid = data.dates[idx].uid;
  const oldDate = data.dates[idx].date;
  // 只有日期真的改變時，才更新 attended / scDates 裡的 key
  // attended/scDates 存的是 uid（有 uid 的話），所以比對要用正確的 key
  if (oldDate !== newDate) {
    const matchKey = oldUid || oldDate;
    data.students.forEach(s => {
      const ai = (s.attended||[]).indexOf(matchKey);
      if (ai !== -1) s.attended[ai] = oldUid || newDate;
      const si = (s.scDates||[]).indexOf(matchKey);
      if (si !== -1) s.scDates[si] = oldUid || newDate;
    });
  }
  data.dates[idx] = { date: newDate, venue, smallVenue, privateVenue, teamCoach, smallCoach, privateCoach, note, isTeam, isSmall, isPrivate, uid: oldUid || (newDate + '_' + Date.now()) };
  data.dates.sort((a, b) => a.date.localeCompare(b.date));
  saveState();
  // If opened from dateManager, go back to it
  const fromManager = document.getElementById('editDateModal')._fromManager;
  document.getElementById('editDateModal').classList.remove('show');
  if (fromManager) {
    showDateManager();
  } else {
    renderPanel();
  }
  renderSidebar();
  // 批量點名開著的話也要更新
  const batchModal = document.getElementById('batchModal');
  if (batchModal && batchModal.style.display !== 'none') renderBatch();
}

function mergeStudentFromEdit() {
  const orig = document.getElementById('editStudentOrig').value;
  // Get all student names across all months
  const allNames = new Set();
  Object.values(state.months).forEach(m => (m.students||[]).forEach(s => { if (s.name !== orig) allNames.add(s.name); }));
  const target = prompt('將「' + orig + '」的所有出席紀錄合併到哪個學員？\n\n請輸入目標學員姓名：\n（可用：' + [...allNames].slice(0,10).join('、') + (allNames.size > 10 ? '...' : '') + '）');
  if (!target || !allNames.has(target)) { if (target) alert('找不到學員「' + target + '」'); return; }
  if (!confirm('確定將「' + orig + '」的所有出席紀錄合併到「' + target + '」？\n合併後「' + orig + '」將被永久刪除。')) return;

  // Merge attended, scDates, privateDates from orig to target in each month
  Object.values(state.months).forEach(m => {
    const from = (m.students||[]).find(s => s.name === orig);
    const to = (m.students||[]).find(s => s.name === target);
    if (from && to) {
      // Merge attended
      (from.attended||[]).forEach(d => { if (!(to.attended||[]).includes(d)) { if (!to.attended) to.attended=[]; to.attended.push(d); } });
      // Merge scDates
      (from.scDates||[]).forEach(d => { if (!(to.scDates||[]).includes(d)) { if (!to.scDates) to.scDates=[]; to.scDates.push(d); } });
      // Merge privateDates
      (from.privateDates||[]).forEach(d => { if (!(to.privateDates||[]).includes(d)) { if (!to.privateDates) to.privateDates=[]; to.privateDates.push(d); } });
    }
    // Delete orig from this month
    if (m.students) m.students = m.students.filter(s => s.name !== orig);
  });

  if (state.selectedStudent === orig) state.selectedStudent = target;
  saveState();
  closeModal();
  renderSidebar();
  renderPanel();
  alert('✓ 合併完成！');
}

function removeStudent(name) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (s.group === '已離隊') {
    if (!confirm('確定要將 ' + name + ' 移回在籍？')) return;
    s.group = s.prevGroup || '幼兒';
    delete s.prevGroup;
    // 同步更新之後所有月份
    const futureMonths = Object.keys(state.months).sort().filter(m => m > state.currentMonth);
    futureMonths.forEach(ym => {
      const fs = (state.months[ym].students||[]).find(x => x.name === name);
      if (fs && fs.group === '已離隊') { fs.group = fs.prevGroup || s.group; delete fs.prevGroup; }
    });
  } else {
    if (!confirm('確定將 ' + name + ' 移至已離隊？資料會保留。')) return;
    s.prevGroup = s.group;
    s.group = '已離隊';
    // 同步更新之後所有月份
    const futureMonths = Object.keys(state.months).sort().filter(m => m > state.currentMonth);
    futureMonths.forEach(ym => {
      const fs = (state.months[ym].students||[]).find(x => x.name === name);
      if (fs) { fs.prevGroup = fs.group; fs.group = '已離隊'; }
    });
  }
  saveState();
  renderSidebar();
  renderPanel();
}

function moveToTrial(name) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (!confirm('將「' + name + '」改為試上學員？\n僅會出現在本月點名，下月起自動隱藏。')) return;
  s.prevGroup = s.prevGroup || s.group;
  s.isTrial = true;
  s.trialMonth = state.currentMonth;
  s.group = s.prevGroup !== '已離隊' ? s.prevGroup : '幼兒';
  saveState();
  renderSidebar();
  renderPanel();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  state._activeTab = tab;
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(); });
});

// ── INIT ──────────────────────────────────────────────
// Set current month dynamically
const _now = new Date();
const _ym = _now.getFullYear() + '-' + String(_now.getMonth()+1).padStart(2,'0');
if (!state.months[_ym]) state.currentMonth = _ym;
const _sel = document.getElementById('monthSelect');
if (_sel) _sel.value = state.currentMonth;

loadState();
updateLockUI();
loadCustomCoachesVenues();
</script>
