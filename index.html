<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐺 黑狼出席管理</title>


<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --black: #010101; --card: #0d0d0d; --dark: #111;
  --yellow: #fcc929; --green: #246e58; --red: #e05c2a;
  --white: #f5f5f0; --gray: #666; --border: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--black); color: var(--white); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; }

/* TOP BAR */
.topbar {
  background: #0a0a0a; border-bottom: 1px solid rgba(252,201,41,0.15);
  padding: 0 16px; min-height: 56px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
@media(max-width:600px) {
  .topbar { padding: 8px 12px; gap: 6px; }
  .topbar .btn, .topbar .btn-outline { font-size:0.72rem; padding:5px 10px; }
  .topbar-logo { font-size:0.82rem; }
}
.topbar-logo { font-size: 0.95rem; font-weight: 900; color: var(--yellow); letter-spacing: 2px; }
.topbar-month { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.topbar-month select, .topbar-month input[type=month] {
  background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 6px 10px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.8rem; cursor: pointer;
}
.btn {
  background: var(--yellow); color: var(--black);
  border: none; padding: 7px 16px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-weight: 700;
  font-size: 0.8rem; cursor: pointer; white-space: nowrap;
  transition: background 0.2s;
}
.btn:hover { background: #e6b520; }
.btn-outline {
  background: none; border: 1px solid rgba(252,201,41,0.35);
  color: var(--yellow);
}
.btn-outline:hover { background: rgba(252,201,41,0.1); }
.btn-red { background: rgba(224,92,42,0.15); color: var(--red); border: 1px solid rgba(224,92,42,0.3); }
.btn-red:hover { background: rgba(224,92,42,0.25); }
.btn-green { background: var(--green); color: white; }
.btn-green:hover { background: #1d5c49; }

/* LAYOUT */
.main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }
@media(max-width:768px){ .main { grid-template-columns: 1fr; } }
@media(max-width:600px){
  .sidebar { padding: 10px; }
    .balance-row { grid-template-columns: repeat(2, 1fr) !important; }
  .dates-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

/* SIDEBAR */
.sidebar {
  background: var(--dark); border-right: 1px solid var(--border);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  height: calc(100vh - 56px); overflow-y: auto; scrollbar-width: none;
}
.sidebar::-webkit-scrollbar { display: none; }
.sidebar-search input {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 8px 12px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem;
}
.sidebar-search input:focus { outline: none; border-color: rgba(252,201,41,0.4); }
.student-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.student-item {
  padding: 10px 12px; border-radius: 4px; cursor: pointer;
  border: 1px solid transparent; transition: all 0.15s;
  display: flex; align-items: center; justify-content: space-between;
}
.student-item:hover { background: rgba(255,255,255,0.04); }
.student-item.active { background: rgba(252,201,41,0.1); border-color: rgba(252,201,41,0.3); }
.student-name { font-size: 0.88rem; font-weight: 700; }
.student-meta { font-size: 0.72rem; color: var(--gray); margin-top: 2px; }
.balance-badge {
  font-size: 0.72rem; font-weight: 700; padding: 2px 8px;
  border-radius: 10px; flex-shrink: 0;
}
.balance-pos { background: rgba(36,110,88,0.2); color: #3aab6e; }
.balance-neg { background: rgba(224,92,42,0.2); color: var(--red); }
.balance-zero { background: rgba(255,255,255,0.05); color: var(--gray); }
.group-header {
  font-size: 0.72rem; font-weight: 900; color: #010101;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 6px 12px; margin-top: 8px;
  background: var(--yellow);
  border-radius: 4px;
}

/* MAIN PANEL */
.panel { padding: 24px; overflow-y: auto; height: calc(100vh - 56px); scrollbar-width: none; }
.panel::-webkit-scrollbar { display: none; }
.panel-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; flex-direction: column; gap: 12px;
  color: var(--gray); font-size: 0.9rem;
}
.panel-empty .icon { font-size: 3rem; opacity: 0.3; }

/* STUDENT CARD */
.student-card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
}
.student-card-info h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 4px; }
.student-card-info .meta { font-size: 0.8rem; color: var(--gray); }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* BALANCE ROW */
.balance-row {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 12px; margin-bottom: 24px;
}
@media(max-width:600px){ .balance-row { grid-template-columns: repeat(2, 1fr); } }
.balance-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 14px 16px;
}
.balance-box-label { font-size: 0.68rem; color: var(--gray); letter-spacing: 1px; margin-bottom: 6px; }
.balance-box-val { font-size: 1.6rem; font-weight: 900; }
.val-yellow { color: var(--yellow); }
.val-green  { color: #3aab6e; }
.val-red    { color: var(--red); }
.val-white  { color: var(--white); }
.balance-box-input {
  display: flex; gap: 6px; margin-top: 8px; align-items: center;
}
.balance-box-input input {
  width: 70px; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); color: var(--white);
  padding: 4px 8px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem;
  text-align: center;
}
.balance-box-input input:focus { outline: none; border-color: rgba(252,201,41,0.4); }

/* ATTENDANCE */
.section-title {
  font-size: 0.72rem; font-weight: 700; color: var(--yellow);
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;
}
.dates-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.date-btn {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 8px; cursor: pointer;
  text-align: center; transition: all 0.15s; user-select: none;
}
.date-btn:hover { border-color: rgba(252,201,41,0.3); }
.date-btn.attended {
  background: rgba(36,110,88,0.2);
  border-color: rgba(36,110,88,0.5);
}
.date-btn .date-day { font-size: 0.7rem; color: var(--gray); }
.date-btn .date-num { font-size: 1rem; font-weight: 700; margin: 2px 0; }
.date-btn .date-venue { font-size: 0.65rem; color: var(--gray); }
.date-btn.attended .date-num { color: #3aab6e; }
.date-btn.attended .date-venue { color: rgba(58,171,110,0.7); }
.check-mark { font-size: 0.7rem; color: #3aab6e; font-weight: 700; }

/* ADD DATE */
.add-date-row {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px 16px; margin-bottom: 24px;
}
.add-date-row input[type=date], .add-date-row input[type=text] {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--white); padding: 6px 10px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.82rem;
}
.add-date-row input:focus { outline: none; border-color: rgba(252,201,41,0.4); }

/* SCREENSHOT PREVIEW */
.preview-card {
  background: #0d0d0d; border: 1px solid rgba(252,201,41,0.2);
  border-radius: 8px; padding: 24px; max-width: 480px;
}
.preview-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.preview-logo { font-size: 1.4rem; }
.preview-title { font-size: 0.7rem; color: var(--yellow); letter-spacing: 2px; }
.preview-name { font-size: 1.2rem; font-weight: 900; }
.preview-divider { height: 1px; background: var(--border); margin: 16px 0; }
.preview-month-title { font-size: 0.72rem; color: var(--yellow); letter-spacing: 2px; margin-bottom: 10px; }
.preview-date-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.85rem;
}
.preview-date-item:last-child { border-bottom: none; }
.preview-check { color: #3aab6e; font-weight: 700; flex-shrink: 0; }
.preview-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 10px; margin-top: 16px;
}
.preview-stat { text-align: center; }
.preview-stat-val { font-size: 1.4rem; font-weight: 900; }
.preview-stat-label { font-size: 0.68rem; color: var(--gray); margin-top: 2px; }
.preview-footer { margin-top: 16px; font-size: 0.72rem; color: var(--gray); text-align: center; }

/* ADD STUDENT MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #111; border: 1px solid var(--border);
  border-radius: 8px; padding: 24px; width: 360px; max-width: 90vw;
}
.modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 0.72rem; color: var(--gray); margin-bottom: 5px; letter-spacing: 1px; }
.form-group input, .form-group select {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  color: var(--white); padding: 8px 12px; border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: rgba(252,201,41,0.4); }
.form-group select option { background: #111; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab-btn {
  background: none; border: none; color: var(--gray);
  padding: 8px 16px; cursor: pointer; font-size: 0.82rem;
  font-family: 'Noto Sans TC', sans-serif; font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all 0.2s;
}
.tab-btn.active { color: var(--yellow); border-bottom-color: var(--yellow); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.date-card-wrap { position: relative; }
.date-del-btn {
  position: absolute; top: 4px; right: 4px;
  background: rgba(224,92,42,0.15); border: none;
  color: var(--red); width: 20px; height: 20px;
  border-radius: 50%; font-size: 0.6rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
.date-card-wrap:hover .date-del-btn { opacity: 1; }

.overview-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
.overview-table th {
  background:#0a0a0a; padding:8px 12px; text-align:left;
  font-size:0.68rem; color:var(--yellow); letter-spacing:1px;
  border-bottom:1px solid var(--border);
}
.overview-table td { padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.04); }
.overview-table tr:hover td { background:rgba(255,255,255,0.02); cursor:pointer; }
.overview-group-row td { background:rgba(252,201,41,0.05); color:var(--yellow); font-size:0.68rem; font-weight:700; letter-spacing:2px; padding:6px 12px; }

.batch-th {
  background:#0a0a0a; padding:8px 10px;
  color:var(--gray); font-size:0.65rem; letter-spacing:1px;
  border:1px solid rgba(255,255,255,0.05); text-align:center;
  position:sticky; top:0; z-index:2;
}
.batch-th.date-col { min-width:60px; }
.batch-name-th {
  background:#0a0a0a; padding:8px 12px;
  color:var(--white); font-size:0.78rem; font-weight:700;
  border:1px solid rgba(255,255,255,0.05);
  position:sticky; left:0; z-index:3; white-space:nowrap;
}
.batch-td {
  padding:4px; border:1px solid rgba(255,255,255,0.04);
  text-align:center; vertical-align:middle;
}
.batch-name-td {
  padding:6px 12px; border:1px solid rgba(255,255,255,0.05);
  white-space:nowrap; position:sticky; left:0; z-index:1;
  background:#0d0d0d; font-size:0.78rem;
}
.batch-name-td .bn { font-weight:700; color:var(--white); }
.batch-name-td .bm { font-size:0.65rem; color:var(--gray); }
.batch-check {
  width:28px; height:28px; border-radius:4px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; font-weight:900; transition:all 0.1s; margin:auto;
  background:rgba(36,110,88,0.12); border:1px solid rgba(36,110,88,0.3);
  color:transparent;
}
.batch-check:hover { background:rgba(36,110,88,0.2); }
.batch-check.checked { background:rgba(36,110,88,0.35); border-color:rgba(36,110,88,0.7); color:#3aab6e; }
.batch-check.batch-small-empty {
  background:rgba(252,201,41,0.1); border:1px solid rgba(252,201,41,0.25); color:transparent;
}
.batch-check.batch-small-empty:hover { background:rgba(252,201,41,0.2); }
.batch-check.batch-small.checked { background:rgba(252,201,41,0.25); border-color:rgba(252,201,41,0.6); color:#fcc929; }
.batch-check.batch-small.checked { background:rgba(252,201,41,0.2); border-color:rgba(252,201,41,0.5); color:#fcc929; }
.batch-check:hover { border-color:rgba(252,201,41,0.4); }
.batch-group-row { background:rgba(252,201,41,0.15); }
.batch-group-row td { padding:7px 14px; color:#010101; background:var(--yellow); font-size:0.75rem; font-weight:900; letter-spacing:3px; border:1px solid rgba(252,201,41,0.3); position:sticky; left:0; z-index:2; }
.batch-total-row td { background:#0a0a0a; color:var(--yellow); font-size:0.7rem; font-weight:700; text-align:center; border:1px solid rgba(255,255,255,0.05); padding:4px; }
#batchTableWrap { scrollbar-width: thin; scrollbar-color: #fcc929 #111; }
#batchTableWrap::-webkit-scrollbar { height: 8px; }
#batchTableWrap::-webkit-scrollbar-track { background: #111; }
#batchTableWrap::-webkit-scrollbar-thumb { background: #fcc929; border-radius: 4px; }

.date-btn-new {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
  transition: border-color 0.15s;
}
.date-btn-new:hover { border-color: rgba(252,201,41,0.3); }
.date-header-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.date-header-row .date-num {
  font-size: 1rem; font-weight: 900; color: var(--white); flex-shrink: 0;
}
.date-day-venue {
  font-size: 0.75rem; color: #aaa; flex: 1; line-height: 1.7; font-weight: 500;
}
.date-check-row {
  display: grid; grid-template-columns: 1fr 1fr;
}
.date-check-box {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 6px; cursor: pointer;
  font-size: 0.78rem; font-weight: 700;
  border-right: 1px solid var(--border);
  transition: all 0.15s; color: var(--gray);
}
.date-check-box:last-child { border-right: none; }
.date-check-box:hover { background: rgba(255,255,255,0.04); }
.date-check-box.checked-team {
  background: rgba(36,110,88,0.2); color: #3aab6e;
}
.date-check-box.checked-small {
  background: rgba(252,201,41,0.15); color: var(--yellow);
}
.check-label { font-size: 0.65rem; letter-spacing: 1px; }

/* MOBILE BOTTOM NAV */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #0a0a0a; border-top: 1px solid rgba(252,201,41,0.15);
  z-index: 49; padding: 8px 0;
}
@media(max-width:768px) { .mobile-nav { display: flex; } }
.mobile-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 6px 4px; cursor: pointer;
  background: none; border: none; color: var(--gray);
  font-family: 'Noto Sans TC', sans-serif; font-size: 0.65rem;
  transition: color 0.15s;
}
.mobile-nav-btn.active { color: var(--yellow); }
.mobile-nav-btn .nav-icon { font-size: 1.2rem; }

/* BACK BUTTON */
.back-fab {
  display: none;
  position: fixed; bottom: 72px; right: 16px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--yellow); color: var(--black);
  border: none; font-size: 1.1rem; cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  z-index: 49; align-items: center; justify-content: center;
}
@media(max-width:768px) { .back-fab { display: flex; } }

/* SYNC TIME */
#syncTime { font-size: 0.65rem; color: #555; }

/* Extra bottom padding on mobile for nav */
@media(max-width:768px) {
  .main { padding-bottom: 60px; }
}

.edit-only { display: none !important; }
body.edit-mode .edit-only { display: inline-block !important; }

/* NEGATIVE WARNING */
.neg-warning {
  background: rgba(224,92,42,0.1); border: 1px solid rgba(224,92,42,0.3);
  border-radius: 6px; padding: 10px 14px; margin-bottom: 16px;
  font-size: 0.82rem; color: var(--red);
}
</style>
</head>

const initialDates = {};

// Load from storage or use initial
function loadState() {
  loadFromGist();
}

function showTopupForm(name) {
  // Close any other open modals first
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
  document.getElementById('batchModal').style.display = 'none';
  const modal = document.getElementById('topupModal');
  // Move modal to body level to avoid z-index stacking issues
  document.body.appendChild(modal);
  modal.style.display = 'flex';
  document.getElementById('topupStudentName').textContent = '學員：' + name;
  document.getElementById('tpRef').value = '';
  document.getElementById('tpAmount').value = '';
  document.getElementById('tpNote').value = '';
  document.getElementById('tpDate').value = new Date().toISOString().split('T')[0];
  document.querySelector('input[name=tpMethod][value="轉帳"]').checked = true;
  tpUpdateHint();
}

function tpClose() {
  document.getElementById('topupModal').style.display = 'none';
}

function tpUpdateHint() {
  const method = document.querySelector('input[name=tpMethod]:checked').value;
  const refGroup = document.getElementById('tpRefGroup');
  const refLabel = document.getElementById('tpRefLabel');
  const refInput = document.getElementById('tpRef');
  if (method === '轉帳') {
    refGroup.style.display = 'block';
    refLabel.textContent = '後五碼';
    refInput.placeholder = '請輸入轉帳後五碼';
  } else if (method === 'LINE PAY') {
    refGroup.style.display = 'block';
    refLabel.textContent = 'LINE 名字';
    refInput.placeholder = '請輸入 LINE 顯示名稱';
  } else {
    refGroup.style.display = 'none';
  }
  tpGenPreview();
}

function tpGenPreview() {
  const name = document.getElementById('topupStudentName').textContent.replace('學員：','');
  const method = document.querySelector('input[name=tpMethod]:checked').value;
  const ref = document.getElementById('tpRef').value.trim();
  const amount = document.getElementById('tpAmount').value;
  const date = document.getElementById('tpDate').value;
  const note = document.getElementById('tpNote').value.trim();
  let msg = '【儲值回報】\n';
  msg += '學員：' + name + '\n';
  msg += '方式：' + method;
  if (ref) msg += '（' + ref + '）';
  msg += '\n';
  if (amount) msg += '堂數：' + amount + ' 堂\n';
  if (date) {
    const dt = new Date(date + 'T00:00:00');
    const days = ['日','一','二','三','四','五','六'];
    msg += '日期：' + date.replace(/-/g,'/') + '（週' + days[dt.getDay()] + '）\n';
  }
  if (note) msg += '備註：' + note + '\n';
  document.getElementById('tpPreview').textContent = msg;
}

function makeCoachLabel(name, inputName) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;align-items:center;gap:4px;';
  wrap.dataset.coach = name;
  const lbl = document.createElement('label');
  lbl.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:0.85rem;color:#f5f5f0;cursor:pointer;';
  lbl.innerHTML = '<input type="checkbox" name="' + inputName + '" value="' + name + '"> ' + name;
  const del = document.createElement('button');
  del.type = 'button';
  del.textContent = '✕';
  del.style.cssText = 'background:none;border:none;color:var(--red);cursor:pointer;font-size:0.7rem;padding:0 2px;line-height:1;';
  del.onclick = () => deleteCoach(name);
  wrap.appendChild(lbl);
  wrap.appendChild(del);
  return wrap;
}

function deleteCoach(name) {
  const defaultCoaches = ['馬哥','松育','芃宜','子豪','紹詠'];
  if (defaultCoaches.includes(name)) { alert('預設教練不能刪除'); return; }
  document.querySelectorAll('[data-coach="' + name + '"]').forEach(el => el.remove());
  const coaches = JSON.parse(localStorage.getItem('bw_coaches') || '[]');
  localStorage.setItem('bw_coaches', JSON.stringify(coaches.filter(c => c !== name)));
}

function deleteVenue(name) {
  const defaultVenues = ['黎光','朝馬','台體大'];
  if (defaultVenues.includes(name)) { alert('預設場地不能刪除'); return; }
  ['newVenue','editVenue'].forEach(id => {

}

function overviewUpdateTopup(name, type, val) {

function showOverview() {
  const data = getCurrentMonthData();
  const monthLabel = state.currentMonth.replace('-', '年') + '月';
  document.getElementById('overviewTitle').textContent = monthLabel + ' 月結總覽';

  // Check previous month for negative balances warning
  const prevMonths = Object.keys(state.months).sort().filter(m => m < state.currentMonth);
  const prevMonth = prevMonths[prevMonths.length - 1];
  let prevWarnHtml = '';
  if (prevMonth) {
    const prevData = state.months[prevMonth];
    const negPrev = prevData.students.filter(s => {
      const bal = (s.prevBalance||0)+(s.midTopup||0)+(s.endTopup||0)-(s.attended?s.attended.length:0);
      return bal < 0 && s.group !== '已離隊';
    });
    if (negPrev.length > 0) {
      prevWarnHtml = '<div style="background:rgba(224,92,42,0.1);border:1px solid rgba(224,92,42,0.3);border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:0.82rem;">' +
        '<div style="color:var(--red);font-weight:700;margin-bottom:6px;">⚠️ 上月（' + prevMonth.replace('-','年') + '月）負數結餘</div>' +
        negPrev.map(s => {
          const bal = (s.prevBalance||0)+(s.midTopup||0)+(s.endTopup||0)-(s.attended?s.attended.length:0);
          return '<span style="margin-right:12px;">' + s.name + ' <strong style="color:var(--red);">' + bal + '堂</strong></span>';
        }).join('') + '</div>';
    }
  }

  // Group students
  const groups = {};
  data.students.filter(s => s.group !== '已離隊').forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  let tableHtml = '<table class="overview-table"><thead><tr><th>姓名</th><th>組別</th><th>上月結餘</th><th>團課</th><th>小班</th><th>月中儲值</th><th>月底儲值</th><th>月底結餘</th><th>小班結餘</th><th>備註</th></tr></thead><tbody>';
  Object.entries(groups).forEach(([g, list]) => {
    tableHtml += '<tr class="overview-group-row"><td colspan="10">' + g + '</td></tr>';
    list.forEach(s => {
      const bal = calcEndBalance(s);
      const scActual = s.scDates ? (Array.isArray(s.scDates) ? s.scDates.length : Object.keys(s.scDates).length) : (s.scAttended||0);
      const scBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActual;
      const balColor = bal < 0 ? 'color:var(--red);font-weight:700;' : bal > 0 ? 'color:#3aab6e;' : '';
      const scColor = scBal < 0 ? 'color:var(--red);font-weight:700;' : scBal > 0 ? 'color:#3aab6e;' : 'color:var(--gray);';
      const teamCount = Array.isArray(s.attended) ? s.attended.length : Object.keys(s.attended||{}).length;
      const isRO = state.isReadOnly;
      tableHtml += '<tr onclick="closeModal();selectStudent(\'' + s.name + '\')">' +
        '<td>' + s.name + (s.bib ? ' <span style="color:var(--gray);font-size:0.72rem;">#' + s.bib + '</span>' : '') + '</td>' +
        '<td style="color:var(--gray);">' + s.group + '</td>' +
        '<td style="color:var(--yellow);">' + (s.prevBalance>=0?'+':'') + (s.prevBalance||0) + '</td>' +
        '<td style="color:#3aab6e;">' + teamCount + '</td>' +
        '<td style="color:#fcc929;">' + (scActual > 0 ? scActual : '—') + '</td>' +
        '<td><input type="number" value="' + (s.midTopup||0) + '" min="0" ' + (isRO?'disabled':'') + ' style="width:52px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--white);text-align:center;border-radius:3px;padding:2px;font-size:0.78rem;" onchange="overviewUpdateTopup(\'' + s.name + '\',\'mid\',this.value)"></td>' +
        '<td><input type="number" value="' + (s.endTopup||0) + '" min="0" ' + (isRO?'disabled':'') + ' style="width:52px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--white);text-align:center;border-radius:3px;padding:2px;font-size:0.78rem;" onchange="overviewUpdateTopup(\'' + s.name + '\',\'end\',this.value)"></td>' +
        '<td style="' + balColor + '">' + (bal>=0?'+':'') + bal + '</td>' +
        '<td style="' + scColor + '">' + (scActual>0||(s.scTopup||0)>0||(s.scPrevBal||0)!==0 ? (scBal>=0?'+':'')+scBal : '—') + '</td>' +
        '<td style="color:var(--gray);font-size:0.78rem;">' + (s.note||'') + '</td>' +
        '</tr>';
    });
  });
  tableHtml += '</tbody></table>';

  document.getElementById('overviewContent').innerHTML = prevWarnHtml + tableHtml;
  const _moverviewModal = document.getElementById('overviewModal'); document.body.appendChild(_moverviewModal); _moverviewModal.classList.add('show');
}

function copyDebtList() {
  const data = getCurrentMonthData();
  const monthLabel = state.currentMonth.replace('-', '年') + '月';
  const debtStudents = data.students.filter(s => {
    return calcEndBalance(s) < 0 && s.group !== '已離隊';
  });
  if (debtStudents.length === 0) { alert('本月沒有堂數不足的學員！'); return; }
  const lines = ['[' + monthLabel + ' 堂數不足名單]', ''];
  debtStudents.forEach(s => {
    const bal = calcEndBalance(s);
    lines.push('・' + s.name + '(' + s.group + ') 差 ' + Math.abs(bal) + ' 堂');
  });
  lines.push('');
  lines.push('請盡快完成儲值，謝謝！');
  navigator.clipboard.writeText(lines.join('\n')).then(() => alert('已複製到剪貼簿！'));
}

function renderBatch() {
  const data = getCurrentMonthData();
  const monthLabel = state.currentMonth.replace('-', '年') + '月';
  document.getElementById('batchMonthLabel').textContent = monthLabel;
  const selectedGroups = getSelectedGroups ? getSelectedGroups() : null;
  const courseFilter = document.getElementById('batchCourseFilter') ? document.getElementById('batchCourseFilter').value : 'all';
  const attendedOnly = document.getElementById('batchAttendedBtn') && document.getElementById('batchAttendedBtn').classList.contains('active');
  const dates = data.dates;
  const batchSearchEl = document.getElementById('batchSearch');
  const searchVal = batchSearchEl ? batchSearchEl.value.toLowerCase() : '';
  const debtOnly = document.getElementById('batchDebtBtn') && document.getElementById('batchDebtBtn').classList.contains('active');
  let students = data.students.filter(s => s.group !== '已離隊');
  if (selectedGroups) students = students.filter(s => selectedGroups.includes(s.group));
  if (searchVal) students = students.filter(s => s.name.includes(searchVal) || (s.bib||'').includes(searchVal));
  if (debtOnly) students = students.filter(s => calcEndBalance(s) < 0);
  if (attendedOnly) {
    students = students.filter(s => {
      const teamCount = (s.attended||[]).filter(a => dates.find(d => (d.uid||d.date) === a)).length;
      const scCount = (s.scDates||[]).filter(a => dates.find(d => (d.uid||d.date) === a)).length;
      if (courseFilter === 'team') return teamCount > 0;
      if (courseFilter === 'small') return scCount > 0;
      return teamCount > 0 || scCount > 0;
    });
  }

  // Header: 學員 | 上月結餘 | 月中儲值 | [課日...] | 合計 | 月底儲值 | 月底剩餘
  const days = ['日','一','二','三','四','五','六'];
  const simpleMode = document.getElementById('batchSimpleBtn') && document.getElementById('batchSimpleBtn').classList.contains('active');
  let thead = '<thead><tr>';
  thead += '<th class="batch-name-th" style="min-width:120px;">學員</th>';
  if (!simpleMode) thead += '<th class="batch-th" style="min-width:64px;color:#fcc929;">上月結餘</th>';
  if (!simpleMode) thead += '<th class="batch-th" style="min-width:64px;color:#3aab6e;">月中儲值</th>';
  const filteredDates = dates.filter(d => {
    if (courseFilter === 'team') return d.isTeam === true;
    if (courseFilter === 'small') return d.isSmall === true;
    return true;
  });
  filteredDates.forEach(d => {
    const dt = new Date(d.date + 'T00:00:00');
    thead += '<th class="batch-th date-col">' + d.date.slice(5).replace('-','/') + '<br><span style="color:#555;">週' + days[dt.getDay()] + '</span><br><span style="color:#444;font-size:0.6rem;">' + (d.venue||'') + '</span>' + (d.coach ? '<br><span style="color:#fcc929;font-size:0.6rem;">' + d.coach + '</span>' : '') + '</th>';
  });
  thead += '<th class="batch-th" style="min-width:50px;">合計</th>';
  if (!simpleMode) thead += '<th class="batch-th" style="min-width:64px;color:#3aab6e;">月底儲值</th>';
  if (!simpleMode) thead += '<th class="batch-th" style="min-width:64px;">月底剩餘</th>';
  thead += '</tr></thead>';

  // Group students
  const groups = {};
  students.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  // Date totals
  const dateTotals = {};
  const dateSmallTotals = {};
  filteredDates.forEach(d => { const k = d.uid||d.date; dateTotals[k] = 0; dateSmallTotals[k] = 0; });
  students.forEach(s => {
    (s.attended||[]).forEach(a => { if (dateTotals[a] !== undefined) dateTotals[a]++; });
    (s.scDates||[]).forEach(a => { if (dateSmallTotals[a] !== undefined) dateSmallTotals[a]++; });
  });

  const totalCols = filteredDates.length + 5; // name + 上月 + 月中 + dates + 合計 + 月底 + 月底剩餘

  let tbody = '<tbody>';
  Object.entries(groups).forEach(([g, list]) => {
    tbody += '<tr class="batch-group-row"><td colspan="' + totalCols + '">' + g + '</td></tr>';
    list.forEach(s => {
      const endBal = calcEndBalance(s);
      const balColor = endBal < 0 ? 'color:var(--red);font-weight:700;' : endBal > 0 ? 'color:#3aab6e;' : 'color:var(--gray);';
      const nameBalColor = endBal < 0 ? 'color:var(--red)' : 'color:#3aab6e';
      tbody += '<tr>';
      // 學員
      const scActual = s.scDates ? s.scDates.length : (s.scAttended||0);
      const scEndBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActual;
      const scBalColor = scEndBal < 0 ? 'color:var(--red)' : 'color:#3aab6e';
      tbody += '<td class="batch-name-td">';
      tbody += '<div class="bn">' + s.name + (s.bib ? ' <span style="color:var(--gray);font-size:0.65rem;">#' + s.bib + '</span>' : '') + '</div>';
      tbody += '<div class="bm" style="' + nameBalColor + '">團 ' + (endBal>=0?'+':'') + endBal + '堂</div>';
      if (scActual > 0 || (s.scTopup||0) > 0 || (s.scPrevBal||0) !== 0 || (s.scMidTopup||0) > 0) {
        tbody += '<div class="bm" style="' + scBalColor + '">小 ' + (scEndBal>=0?'+':'') + scEndBal + '堂</div>';
      }
      tbody += '</td>';
      // 上月結餘
      if (!simpleMode) tbody += '<td class="batch-td">' +
        '<div style="color:var(--yellow);font-size:0.72rem;">' + (s.prevBalance>=0?'+':'') + (s.prevBalance||0) + '</div>' +
        ((s.scPrevBal||0) !== 0 ? '<div style="color:#fcc929;font-size:0.68rem;">小' + (s.scPrevBal>=0?'+':'') + (s.scPrevBal||0) + '</div>' : '') +
        '</td>';
      // 月中儲值
      if (!simpleMode) {
        if (state.isReadOnly) {
          tbody += '<td class="batch-td" style="text-align:center;">' +
            '<div style="color:var(--white);font-size:0.72rem;">+' + (s.midTopup||0) + '</div>' +
            ((s.scMidTopup||0) ? '<div style="color:#fcc929;font-size:0.68rem;">小+' + (s.scMidTopup||0) + '</div>' : '') +
            '</td>';
        } else {
          tbody += '<td class="batch-td">' +
            '<input type="number" value="' + (s.midTopup||0) + '" min="0" placeholder="團" ' +
            'style="width:48px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--white);text-align:center;border-radius:3px;padding:2px;font-size:0.72rem;display:block;margin-bottom:2px;" ' +
            'data-name="' + s.name + '" data-type="mid" onchange="batchUpdateTopup(this)">' +
            '<input type="number" value="' + (s.scMidTopup||0) + '" min="0" placeholder="小" ' +
            'style="width:48px;background:rgba(252,201,41,0.05);border:1px solid rgba(252,201,41,0.15);color:#a08010;text-align:center;border-radius:3px;padding:2px;font-size:0.72rem;display:block;" ' +

  tbody += '<td></td>' + (simpleMode ? '' : '<td></td><td></td>') + '</tr>';
  tbody += '</tbody>';

  document.getElementById('batchTable').innerHTML = thead + tbody;
}

function batchUpdateTopup(input) {
  if (state.isReadOnly) return;
  const name = input.dataset.name;
  const type = input.dataset.type;
  const val = parseInt(input.value) || 0;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (type === 'mid') s.midTopup = val;
  else if (type === 'end') s.endTopup = val;
  else if (type === 'scMid') s.scMidTopup = val;
  else if (type === 'scTopup') s.scTopup = val;
  saveState();
  renderSidebar();
  // Don't re-render batch - it would reset input focus and values
}

function toggleBatchCell(el) {
  if (state.isReadOnly) return;
  const name = el.dataset.name;
  const date = el.dataset.date;
  const type = el.dataset.type;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (type === 'small') {
    if (!s.scDates) s.scDates = [];
    const idx = s.scDates.indexOf(date);
    if (idx === -1) s.scDates.push(date);
    else s.scDates.splice(idx, 1);
    s.scAttended = s.scDates.length;
  } else {
    if (!s.attended) s.attended = [];
    const idx = s.attended.indexOf(date);
    if (idx === -1) s.attended.push(date);
    else s.attended.splice(idx, 1);
  }
  saveState();
  renderSidebar();
  renderBatch();
}

function generateFixedDates(ym) {
  // Fixed schedule: Tue=黎光, Wed=黎光, Fri=黎光, Sat=朝馬, Sun=台體大
  const schedule = { 2:'黎光', 3:'黎光', 5:'黎光', 6:'朝馬', 0:'台體大' };
  const [year, month] = ym.split('-').map(Number);
  const dates = [];
  const daysInMonth = new Date(year, month, 0).getDate();
  for (let day = 1; day <= daysInMonth; day++) {
    const dt = new Date(year, month - 1, day);
    const dow = dt.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
    if (schedule[dow] !== undefined) {
      const dateStr = year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      dates.push({ date: dateStr, venue: schedule[dow], coach: '' });
    }
  }
  return dates;
}

function exportBatchPDF() {
  const data = getCurrentMonthData();

  const attendedOnly = document.getElementById('batchAttendedBtn') && document.getElementById('batchAttendedBtn').classList.contains('active');
  const allDates = data.dates;
  const filteredDates = allDates.filter(d => {
    if (courseFilter === 'team') return d.isTeam === true;
    if (courseFilter === 'small') return d.isSmall === true;
    return true;
  });
  const days = ['日','一','二','三','四','五','六'];

  const batchSearchEl = document.getElementById('batchSearch');
  const searchVal = batchSearchEl ? batchSearchEl.value.toLowerCase() : '';
  const debtOnly = document.getElementById('batchDebtBtn') && document.getElementById('batchDebtBtn').classList.contains('active');
  let students = data.students.filter(s => s.group !== '已離隊');
  if (selectedGroups) students = students.filter(s => selectedGroups.includes(s.group));
  if (searchVal) students = students.filter(s => s.name.includes(searchVal) || (s.bib||'').includes(searchVal));
  if (debtOnly) students = students.filter(s => calcEndBalance(s) < 0);
  if (attendedOnly) {
    students = students.filter(s => {
      const tc = (s.attended||[]).filter(a => filteredDates.find(d => (d.uid||d.date)===a)).length;
      const sc = (s.scDates||[]).filter(a => filteredDates.find(d => (d.uid||d.date)===a)).length;
      if (courseFilter === 'team') return tc > 0;
      if (courseFilter === 'small') return sc > 0;
      return tc > 0 || sc > 0;

function toggleEdit() {
  if (!state.isReadOnly) {
    state.isReadOnly = true;
    updateLockUI();
    renderSidebar();
    renderPanel();
    return;
  }
  const pwd = prompt('請輸入編輯密碼：');
  if (pwd === EDIT_PASSWORD) {
    state.isReadOnly = false;
    updateLockUI();
    renderSidebar();
    renderPanel();
  } else if (pwd !== null) {
    alert('密碼錯誤');
  }
}

function updateLockUI() {
  const el = document.getElementById('lockStatus');
  const syncBtn = document.getElementById('syncBtn');
  const navIcon = document.getElementById('nav-lock-icon');
  const navLabel = document.getElementById('nav-lock-label');
  if (!el) return;
  if (state.isReadOnly) {
    el.innerHTML = '🔒 <span style="color:#666;">唯讀</span>';
    if (syncBtn) syncBtn.style.display = 'none';
    if (navIcon) navIcon.textContent = '🔒';
    if (navLabel) navLabel.textContent = '唯讀';
    document.body.classList.remove('edit-mode');
  } else {
    el.innerHTML = '🔓 <span style="color:#3aab6e;">編輯</span>';
    if (syncBtn) syncBtn.style.display = 'inline-block';
    if (navIcon) navIcon.textContent = '🔓';
    if (navLabel) navLabel.textContent = '編輯';
    document.body.classList.add('edit-mode');
  }
}


const GIST_ID = 'adc626cbf7b7f74310f70df17f24c276';
const GITHUB_TOKEN = localStorage.getItem('bw_gh_token') || '';

function syncToGist() {
  let token = localStorage.getItem('bw_gh_token');
  if (!token) {
    token = prompt('請輸入 GitHub Token（只需輸入一次）：');
    if (!token) return;
    localStorage.setItem('bw_gh_token', token);
  }
  const btn = document.getElementById('syncBtn');
  btn.textContent = '☁ 同步中...';
  btn.disabled = true;
  const data = JSON.stringify(state);
  fetch('https://api.github.com/gists/' + GIST_ID, {
    method: 'PATCH',
    headers: {
      'Authorization': 'token ' + GITHUB_TOKEN,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ files: { 'bwfc.json': { content: data } } })
  })
  .then(r => r.json())
  .then(() => {
    btn.textContent = '✓ 已同步';
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    const syncTimeEl = document.getElementById('syncTime');
    if (syncTimeEl) syncTimeEl.textContent = '上次同步 ' + timeStr;
    setTimeout(() => {
      btn.textContent = '☁ 同步';
      btn.disabled = false;
    }, 2000);
  })
  .catch(e => {
    alert('同步失敗：' + e.message);
    btn.textContent = '☁ 同步給教練';
    btn.disabled = false;
  });
}

function loadFromGist() {
  // Check local timestamp first
  const localTs = getLocalTimestamp();
  
  fetch('https://api.github.com/gists/' + GIST_ID)
  .then(r => r.json())
  .then(data => {
    const content = data.files['bwfc.json'].content;
    const parsed = JSON.parse(content);
    const gistTs = parsed._savedAt || 0;
    
    // Use whichever is newer
    if (parsed.months && Object.keys(parsed.months).length > 0) {
      const hasStudents = Object.values(parsed.months).some(m => m.students && m.students.length > 0);
      if (hasStudents) {
        if (localTs > gistTs) {
          // Local is newer - use local
          loadLocalState();
          console.log('使用本機資料（較新）');
        } else {
          // Gist is newer - use gist
          const prevReadOnly = state.isReadOnly;
          state = { ...state, ...parsed };
          state.isReadOnly = true;
          state.groupFilter = 'all';
          state.debtFilter = false;
          try { localStorage.setItem('bw_state', JSON.stringify(state)); } catch(e) {}
          document.getElementById('monthSelect').value = state.currentMonth;
          renderSidebar();
          renderPanel();
          console.log('使用 Gist 資料（較新）');
        }
        return;
      }
    }
    loadLocalState();
  })
  .catch(() => loadLocalState());
}

function ensureDateUids(state) {
  Object.values(state.months||{}).forEach(m => {
    (m.dates||[]).forEach((d, i) => {
      if (!d.uid) d.uid = d.date + '_legacy_' + i;
    });
  });
}

function loadLocalState() {
  try {
    const saved = localStorage.getItem('bw_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.months && Object.keys(parsed.months).length > 0) {
        const hasStudents = Object.values(parsed.months).some(m => m.students && m.students.length > 0);
        if (hasStudents) {
          state = { ...state, ...parsed };
          state.groupFilter = 'all';
          state.debtFilter = false;
          state.isReadOnly = true;
          ensureDateUids(state);
          updateLockUI();
          renderSidebar();
          renderPanel();
          return;
        }
      }
    }
  } catch(e) {}
  state.months['2026-04'] = {
    dates: generateFixedDates('2026-04'),
    students: JSON.parse(JSON.stringify(initialStudents))
  };
  saveState();
  updateLockUI();
  renderSidebar();
  renderPanel();
}

function getLocalTimestamp() {
  try {
    const saved = localStorage.getItem('bw_state');
    if (saved) return JSON.parse(saved)._savedAt || 0;
  } catch(e) {}
  return 0;
}

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const d = new Date();
  const dateStr = d.getFullYear() + (d.getMonth()+1).toString().padStart(2,'0') + d.getDate().toString().padStart(2,'0');
  a.download = '黑狼出席備份_' + dateStr + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.months) { alert('檔案格式不正確'); return; }
      if (!confirm('匯入後會覆蓋現有資料，確定繼續？')) return;
      state = { ...state, ...parsed };
      state.groupFilter = 'all';
      state.debtFilter = false;
      saveState();
      document.getElementById('currentMonth').value = state.currentMonth;
      renderSidebar();
      renderPanel();
      alert('匯入成功！');
    } catch(err) {
      alert('匯入失敗：' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function saveState() {
  if (!state.isReadOnly) {
    state._savedAt = Date.now();
    try { localStorage.setItem('bw_state', JSON.stringify(state)); } catch(e) {}
  }
}

function getCurrentMonthData() {
  if (!state.months[state.currentMonth]) {
    const prevMonths = Object.keys(state.months).sort();
    const latestPrev = prevMonths[prevMonths.length - 1];
    let students = [];
    if (latestPrev && state.months[latestPrev]) {
      students = state.months[latestPrev].students.map(s => ({
        ...s,
        prevBalance: calcEndBalance(s),
        attended: [],
        midTopup: 0,
        endTopup: 0,
        giftTopup: 0,
        scGiftTopup: 0,
        scMidTopup: 0,
        scPrevBal: ((s.scPrevBal||0) + (s.scMidTopup||0) + (s.scTopup||0) + (s.scGiftTopup||0) - (s.scDates ? s.scDates.length : (s.scAttended||0))),
        scTopup: 0,
        scAttended: 0
      }));
    }
    const dates = generateFixedDates(state.currentMonth);
    state.months[state.currentMonth] = { dates, students };
    saveState();
  } else if (!state.months[state.currentMonth].dates || state.months[state.currentMonth].dates.length === 0) {
    // Month exists but has no dates - regenerate
    state.months[state.currentMonth].dates = generateFixedDates(state.currentMonth);
    saveState();
  }
  return state.months[state.currentMonth];
}

function calcEndBalance(s) {
  return (s.prevBalance || 0) + (s.midTopup || 0) + (s.endTopup || 0) + (s.giftTopup || 0) - (s.attended ? s.attended.length : 0);
}

// ── RENDER ────────────────────────────────────────────
function renderSidebar() {
  const data = getCurrentMonthData();
  if (!data || !data.students) return;
  const search = document.getElementById('searchInput').value.toLowerCase();
  let students = data.students;
  if (state.groupFilter !== 'all') students = students.filter(s => s.group === state.groupFilter);
  if (search) students = students.filter(s => s.name.includes(search));
  if (state.debtFilter) students = students.filter(s => calcEndBalance(s) < 0 && s.group !== '已離隊');

  const groups = {};
  students.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  let html = '';
  Object.entries(groups).forEach(([g, list]) => {
    html += `<div class="group-header">${g}</div>`;
    list.forEach(s => {
      const bal = calcEndBalance(s);
      const balClass = bal > 0 ? 'balance-pos' : bal < 0 ? 'balance-neg' : 'balance-zero';
      const scActualSB = s.scDates ? s.scDates.length : (s.scAttended||0);
      const scBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActualSB;
      const scBalClass = scBal > 0 ? 'balance-pos' : scBal < 0 ? 'balance-neg' : 'balance-zero';
      const hasSmallClass = scActualSB > 0 || (s.scTopup||0) > 0 || (s.scPrevBal||0) !== 0 || (s.scMidTopup||0) > 0;
      const active = state.selectedStudent === s.name ? 'active' : '';
      html += `<div class="student-item ${active}" onclick="selectStudent('${s.name}')">
        <div>
          <div class="student-name">${s.name}</div>
          <div class="student-meta">${s.group}${s.bib ? ' · #' + s.bib : ''} · 團${s.attended.length}堂${scActualSB > 0 ? ' 小' + scActualSB + '堂' : ''}${s.note ? ' · ' + s.note : ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
          <div class="balance-badge ${balClass}">${bal > 0 ? '+' : ''}${bal}</div>
          ${hasSmallClass ? `<div class="balance-badge ${scBalClass}" style="font-size:0.62rem;">${scBal > 0 ? '+' : ''}${scBal}</div>` : ''}
        </div>
      </div>`;
    });
  });
  document.getElementById('studentList').innerHTML = html;
}

function selectStudent(name) {
  state.selectedStudent = name;
  renderSidebar();
  renderPanel();
  setTimeout(() => {
    const panel = document.getElementById('mainPanel');
    if (panel) panel.scrollTop = 0;

      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const fab = document.getElementById('backFab');
      if (fab) fab.style.display = 'flex';
    }
  }, 50);
}

        <div class="preview-header">

            <div class="preview-title">灣島黑狼 FC · 出席紀錄</div>

          </div>

        <div class="preview-divider"></div>
        <div class="preview-month-title">${monthLabel} 上課紀錄</div>
        ${previewDates}
        <div class="preview-divider"></div>
        <div style="font-size:0.68rem;color:var(--yellow);letter-spacing:2px;margin:12px 0 6px;">團課</div>
        <div class="preview-stats">
          <div class="preview-stat">
            <div class="preview-stat-val val-yellow">${s.prevBalance >= 0 ? '+' : ''}${s.prevBalance}</div>
            <div class="preview-stat-label">上月結餘</div>
          </div>
          <div class="preview-stat">
            <div class="preview-stat-val" style="color:#3aab6e;">${s.attended.length}</div>
            <div class="preview-stat-label">本月上課</div>
          </div>
          <div class="preview-stat">
            <div class="preview-stat-val val-green">+${(s.midTopup||0) + (s.endTopup||0) + (s.giftTopup||0)}</div>
            <div class="preview-stat-label">本月儲值</div>
          </div>
          <div class="preview-stat">
            <div class="preview-stat-val ${bal < 0 ? 'val-red' : 'val-green'}">${bal >= 0 ? '+' : ''}${bal}</div>
            <div class="preview-stat-label">月底剩餘</div>
          </div>
        </div>
        ${(() => {
          const scActual = s.scDates ? s.scDates.length : (s.scAttended||0);
          const scBal = (s.scPrevBal||0)+(s.scMidTopup||0)+(s.scTopup||0)+(s.scGiftTopup||0)-scActual;
          if ((s.scTopup||0) === 0 && (s.scAttended||0) === 0 && (s.scPrevBal||0) === 0) return '';
          return '<div style=\"font-size:0.68rem;color:#fcc929;letter-spacing:2px;margin:12px 0 6px;\">小班課</div>' +
            '<div class=\"preview-stats\">' +
              '<div class=\"preview-stat\"><div class=\"preview-stat-val val-yellow\">' + ((s.scPrevBal||0)>=0?'+':'') + (s.scPrevBal||0) + '</div><div class=\"preview-stat-label\">上月結餘</div></div>' +
              '<div class=\"preview-stat\"><div class=\"preview-stat-val val-yellow\">' + (s.scAttended||0) + '</div><div class=\"preview-stat-label\">本月上課</div></div>' +
              '<div class=\"preview-stat\"><div class=\"preview-stat-val val-yellow\">+' + (s.scTopup||0) + '</div><div class=\"preview-stat-label\">本月儲值</div></div>' +
              '<div class=\"preview-stat\"><div class=\"preview-stat-val ' + (scBal<0?'val-red':'val-green') + '\">' + (scBal>=0?'+':'') + scBal + '</div><div class=\"preview-stat-label\">月底剩餘</div></div>' +
            '</div>';
        })()}
        <div class="preview-footer">灣島黑狼 FC · 足球 × 教育 × 成長</div>
      </div>

    </div>
  `;
}

// ── ACTIONS ───────────────────────────────────────────

function toggleDate(studentName, date, type) {
  if (state.isReadOnly) return;
  const currentTab = state._activeTab || 'attendance';
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === studentName);
  if (!s) return;
  if (type === 'small') {
    if (!s.scDates) s.scDates = [];
    const idx = s.scDates.indexOf(date);
    if (idx === -1) s.scDates.push(date);
    else s.scDates.splice(idx, 1);
    // Auto-update scAttended count
    s.scAttended = s.scDates.length;
  } else {
    if (!s.attended) s.attended = [];
    const idx = s.attended.indexOf(date);
    if (idx === -1) s.attended.push(date);
    else s.attended.splice(idx, 1);
  }
  saveState();
  renderSidebar();
  renderPanel();
  // Restore tab after re-render
  const tab = state._activeTab || 'attendance';
  const tabBtn = document.querySelector(`.tab-btn[onclick*="${tab}"]`);
  const tabContent = document.getElementById('tab-' + tab);
  if (tabBtn && tabContent) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tabBtn.classList.add('active');
    tabContent.classList.add('active');
  }
}

function updateTopup(name, type, val) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  const n = parseInt(val) || 0;
  if (type === 'mid') s.midTopup = n;
  else if (type === 'end') s.endTopup = n;
  else if (type === 'gift') s.giftTopup = n;
  else if (type === 'scGift') s.scGiftTopup = n;
  else if (type === 'scMid') s.scMidTopup = n;
  else if (type === 'scTopup') s.scTopup = n;
  else if (type === 'scAttended') s.scAttended = n;
  saveState();
  renderSidebar();
  renderPanel();
}

function filterStudents() { renderSidebar(); }

function toggleDebtFilter() {
  const btn = document.getElementById('debtFilterBtn');
  state.debtFilter = !state.debtFilter;
  btn.style.background = state.debtFilter ? 'rgba(224,92,42,0.2)' : 'none';
  renderSidebar();
}
function filterGroup(g) { state.groupFilter = g; renderSidebar(); }

function changeMonthSelect(val) {
  document.getElementById('currentMonth').value = val;
  changeMonth();
}

function changeMonth() {
  const prev = state.currentMonth;
  state.currentMonth = document.getElementById('currentMonth').value;
  state.selectedStudent = null;
  // Check if new month - show warning about previous negative balances
  if (!state.months[state.currentMonth]) {
    getCurrentMonthData(); // initialize
    const prevData = state.months[prev];
    if (prevData) {
      const neg = prevData.students.filter(s => calcEndBalance(s) < 0 && s.group !== '已離隊');
      if (neg.length > 0) {
        const names = neg.map(s => s.name + '(' + calcEndBalance(s) + '堂)').join('、');
        setTimeout(() => alert('換月提醒\n\n以下學員上月堂數不足，請確認是否已補繳：\n\n' + names), 300);
      }
    }
  }
  saveState();
  renderSidebar();
  renderPanel();
}

function showAddStudent() { const _maddStudentModal = document.getElementById('addStudentModal'); document.body.appendChild(_maddStudentModal); _maddStudentModal.classList.add('show'); }
function showDateManager() {
  const data = getCurrentMonthData();
  const dates = data.dates || [];
  const days = ['日','一','二','三','四','五','六'];
  let content = '<div style="display:flex;flex-direction:column;gap:8px;">';
  if (dates.length === 0) {
    content += '<div style="color:var(--gray);text-align:center;padding:20px;">本月尚無課日</div>';
  } else {
    dates.sort((a,b) => a.date.localeCompare(b.date)).forEach(d => {
      const dt = new Date(d.date + 'T00:00:00');
      const label = d.date.replace(/-/g,'/') + ' 週' + days[dt.getDay()] + (d.venue ? ' · ' + d.venue : '') + (d.coach ? ' 【' + d.coach + '】' : '') + (d.note ? ' · ' + d.note : '');
      content += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:8px 12px;">' +
        '<span style="font-size:0.85rem;">' + label + '</span>' +
        '<div style="display:flex;gap:6px;">' +
        '<button class="btn btn-outline" onclick="openEditDate(\'' + (d.uid||d.date) + '\', true)" style="font-size:0.72rem;padding:4px 10px;">✎</button>' +
        '<button class="btn btn-red" onclick="deleteDateDirect(\'' + (d.uid||d.date) + '\')" style="font-size:0.72rem;padding:4px 10px;">✕</button>' +
        '</div></div>';
    });
  }
  content += '</div>';
  document.getElementById('dateManagerContent').innerHTML = content;
  const modal = document.getElementById('dateManagerModal');
  document.body.appendChild(modal);
  modal.classList.add('show');
}

function deleteDateDirect(date) {
  if (!confirm('確定刪除 ' + date + '？')) return;
  const data = getCurrentMonthData();
  const delKey = data.dates.find(d => (d.uid||d.date) === date)?.uid || date;
  data.dates = data.dates.filter(d => (d.uid||d.date) !== date);
  data.students.forEach(s => {
    s.attended = (s.attended||[]).filter(a => a !== delKey && a !== date);
    s.scDates = (s.scDates||[]).filter(a => a !== delKey && a !== date);
  });
  saveState();
  showDateManager();
  renderSidebar();
}

function showAddDate() {
  const [y, m] = state.currentMonth.split('-');
  document.getElementById('newDateY').value = y;
  document.getElementById('newDateM').value = m;
  document.getElementById('newDateD').value = '01';
  document.getElementById('newIsTeam').checked = false;
  document.getElementById('newIsSmall').checked = false;
  const _maddDateModal = document.getElementById('addDateModal'); document.body.appendChild(_maddDateModal); _maddDateModal.classList.add('show');
}
function closeModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
}

function addStudent() {
  if (state.isReadOnly) { alert('請先解鎖編輯模式'); return; }
  const name = document.getElementById('newName').value.trim();
  const group = document.getElementById('newGroup').value;
  const bib = document.getElementById('newBib').value.trim();
  const prevBalance = parseInt(document.getElementById('newPrevBalance').value) || 0;
  if (!name) return;
  const data = getCurrentMonthData();
  if (data.students.find(s => s.name === name)) { alert('學員已存在'); return; }
  data.students.push({ name, group, bib, prevBalance, attended: [], midTopup: 0, endTopup: 0 });
  saveState();
  closeModal();
  document.getElementById('newName').value = '';
  renderSidebar();
}

function addDate() {
  if (state.isReadOnly) { alert('請先解鎖編輯模式'); return; }
  const y = document.getElementById('newDateY').value;
  const m = document.getElementById('newDateM').value;
  const d = document.getElementById('newDateD').value;
  if (!y || !m || !d) return;
  const date = y + '-' + m + '-' + d;
  const venue = document.getElementById('newVenue').value;
  const coach = Array.from(document.querySelectorAll('input[name=coachCheck]:checked')).map(x=>x.value).join('、');
  const data = getCurrentMonthData();
  if (!data) return;
  const noteEl = document.getElementById('newDateNote');
  const noteVal2 = noteEl ? noteEl.value.trim() : '';
  const isTeamEl = document.getElementById('newIsTeam');
  const isSmallEl = document.getElementById('newIsSmall');
  const isTeam2 = isTeamEl ? isTeamEl.checked : false;
  const isSmall2 = isSmallEl ? isSmallEl.checked : false;
  const uid = date + '_' + Date.now();
  data.dates.push({ date, venue, coach, note: noteVal2, isTeam: isTeam2, isSmall: isSmall2, uid });
  data.dates.sort((a, b) => a.date.localeCompare(b.date));
  saveState();
  closeModal();
  document.getElementById('newDateY').value = '2026';
  document.getElementById('newDateM').value = '01';
  document.getElementById('newDateD').value = '01';
  document.getElementById('newVenue').value = '';
  document.querySelectorAll('input[name=coachCheck]').forEach(c => c.checked = false);
  renderPanel();
}

function openEditDate(dateOrUid, fromManager) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const d = data.dates.find(x => (x.uid||x.date) === dateOrUid || x.date === dateOrUid);
  if (!d) return;
  const date = d.date;
  document.getElementById('editDateOrig').value = d.uid || d.date;
  const parts = date.split('-');
  document.getElementById('editDateY').value = parts[0];
  document.getElementById('editDateM').value = parts[1];
  document.getElementById('editDateD').value = parts[2];
  document.getElementById('editVenue').value = d.venue || '';
  document.getElementById('editDateNote').value = d.note || '';
  document.getElementById('editIsTeam').checked = d.isTeam === true;
  document.getElementById('editIsSmall').checked = d.isSmall === true;
  const coaches = (d.coach || '').split('、').filter(Boolean);
  document.querySelectorAll('input[name=editCoachCheck]').forEach(c => {
    c.checked = coaches.includes(c.value);
  });
  const _meditDateModal = document.getElementById('editDateModal');
  _meditDateModal._fromManager = fromManager || false;
  document.body.appendChild(_meditDateModal); _meditDateModal.classList.add('show');
}

function saveEditDate() {
  if (state.isReadOnly) return;
  const orig = document.getElementById('editDateOrig').value;
  const y = document.getElementById('editDateY').value;
  const m = document.getElementById('editDateM').value;
  const d = document.getElementById('editDateD').value;
  const newDate = y + '-' + m + '-' + d;
  const venue = document.getElementById('editVenue').value;
  const coach = Array.from(document.querySelectorAll('input[name=editCoachCheck]:checked')).map(x=>x.value).join('、');
  const note = (document.getElementById('editDateNote').value || '').trim();
  const isTeam = document.getElementById('editIsTeam').checked;
  const isSmall = document.getElementById('editIsSmall').checked;
  const data = getCurrentMonthData();
  const idx = data.dates.findIndex(x => (x.uid||x.date) === orig);
  if (idx === -1) return;
  if (orig !== newDate) {
    data.students.forEach(s => {
      const ai = (s.attended||[]).indexOf(orig);
      if (ai !== -1) s.attended[ai] = newDate;
      const si = (s.scDates||[]).indexOf(orig);
      if (si !== -1) s.scDates[si] = newDate;
    });
  }
  const oldUid = data.dates[idx].uid;
  data.dates[idx] = { date: newDate, venue, coach, note, isTeam, isSmall, uid: oldUid || (newDate + '_' + Date.now()) };
  data.dates.sort((a, b) => a.date.localeCompare(b.date));
  saveState();
  // If opened from dateManager, go back to it
  const fromManager = document.getElementById('editDateModal')._fromManager;
  document.getElementById('editDateModal').classList.remove('show');
  if (fromManager) {
    showDateManager();
  } else {
    renderPanel();
  }
  renderSidebar();
}

function deleteDateFromEdit() {
  if (state.isReadOnly) return;
  const orig = document.getElementById('editDateOrig').value;
  if (!confirm('確定刪除 ' + orig + ' 這個課日？')) return;
  const data = getCurrentMonthData();
  data.dates = data.dates.filter(d => (d.uid||d.date) !== orig);
  saveState();
  const fromManager = document.getElementById('editDateModal')._fromManager;
  document.getElementById('editDateModal').classList.remove('show');
  if (fromManager) showDateManager();
  renderSidebar();
  renderPanel();
}

function deleteDate(date) {
  if (!confirm('確定刪除 ' + date + ' 這個課日？\n注意：學員出席紀錄不會改變，堂數計算不受影響。')) return;
  const data = getCurrentMonthData();
  data.dates = data.dates.filter(d => d.date !== date);
  saveState();
  renderSidebar();
  renderPanel();
}

function openEditStudent(name) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  document.getElementById('editStudentOrig').value = name;
  document.getElementById('editName').value = s.name;
  document.getElementById('editGroup').value = s.group;
  document.getElementById('editBib').value = s.bib || '';
  document.getElementById('editPrevBalance').value = s.prevBalance || 0;
  document.getElementById('editScPrevBal').value = s.scPrevBal || 0;
  document.getElementById('editNote').value = s.note || '';
  const modal = document.getElementById('editStudentModal');
  document.body.appendChild(modal);
  modal.classList.add('show');
}

function deleteStudentFromEdit() {
  const orig = document.getElementById('editStudentOrig').value;
  if (!confirm('確定永久刪除 ' + orig + '？此動作無法復原。')) return;
  const data = getCurrentMonthData();
  data.students = data.students.filter(s => s.name !== orig);
  if (state.selectedStudent === orig) state.selectedStudent = null;
  saveState();
  closeModal();
  renderSidebar();
  renderPanel();
}

function saveEditStudent() {
  if (state.isReadOnly) return;
  const orig = document.getElementById('editStudentOrig').value;
  const newName = document.getElementById('editName').value.trim();
  const group = document.getElementById('editGroup').value;
  const bib = document.getElementById('editBib').value.trim();
  const prevBalance = parseInt(document.getElementById('editPrevBalance').value) || 0;
  const scPrevBal = parseInt(document.getElementById('editScPrevBal').value) || 0;
  if (!newName) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === orig);
  if (!s) return;
  // If name changed, update attended references
  if (orig !== newName) {
    if (data.students.find(x => x.name === newName)) { alert('此姓名已存在'); return; }
  }
  s.name = newName;
  s.group = group;
  s.bib = bib;
  s.prevBalance = prevBalance;
  s.scPrevBal = scPrevBal;
  s.note = document.getElementById('editNote').value.trim();
  if (state.selectedStudent === orig) state.selectedStudent = newName;
  saveState();
  closeModal();
  renderSidebar();
  renderPanel();
}

function removeStudent(name) {
  if (state.isReadOnly) return;
  const data = getCurrentMonthData();
  const s = data.students.find(x => x.name === name);
  if (!s) return;
  if (s.group === '已離隊') {
    if (!confirm('確定要將 ' + name + ' 移回在籍？')) return;
    s.group = s.prevGroup || '幼兒';
    delete s.prevGroup;
  } else {
    if (!confirm('確定將 ' + name + ' 移至已離隊？資料會保留。')) return;
    s.prevGroup = s.group;
    s.group = '已離隊';
  }
  saveState();
  renderSidebar();
  renderPanel();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  state._activeTab = tab;
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(); });
});
